<!-- Dues follow-up: the daily call list, longest waiting first -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <h2 style="font-size: 18px; font-weight: 600; margin:0;">📞 Dues Follow-up</h2>
    <div style="display:flex; gap:8px;">
      <input type="search" id="followup-search" placeholder="Search name or number…" oninput="filterFollowup()" style="padding:6px 10px; border:1px solid var(--color-border); border-radius:6px; font-size:13px;" class="search-wide" />
      <button class="btn btn-secondary btn-sm" type="button" onclick="resetFollowupFilters()" title="Clear the search box">↺ Reset</button>
      <button class="btn btn-secondary btn-sm" onclick="loadFollowup()">Refresh</button>
    </div>
  </div>
  <p style="font-size:12px; color:var(--color-text-muted); margin-bottom:12px;">One row per owing customer, longest waiting first. WhatsApp opens with the reminder text prefilled.</p>
  <div id="followup-table"></div>
  <p id="followup-count" style="font-size:12px; color:var(--color-text-muted); margin-top:8px;"></p>
</div>

<script>
(function(){
  let allRows = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Normalize to a dialable 91-prefix mobile number, or "" when unusable.
  function waNumber(raw) {
    const digits = String(raw == null ? "" : raw).replace(/\D/g, "");
    if (digits.length === 10) return "91" + digits;
    if (digits.length === 12 && digits.indexOf("91") === 0) return digits;
    return "";
  }

  function remindAction(r) {
    const num = waNumber(r.contact_number) || waNumber(r.contact_number_2);
    if (!num) {
      return `<button class="btn btn-sm btn-wa" data-block-reason="No usable mobile number for ${esc(r.customer_name)} — update it on the Customers page first.">WhatsApp</button>`;
    }
    const text = "Hello " + (r.customer_name || "") + ", this is Shresth Masala Industry. "
      + "Your outstanding balance is " + window.UI.money(r.total_outstanding)
      + (r.oldest_challan_date ? " (oldest due " + window.UI.dateTimeText(r.oldest_challan_date) + ")" : "")
      + ". Please pay at the earliest.";
    return `<a class="btn btn-sm btn-primary" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(text)}">WhatsApp</a>`;
  }

  function renderFollowupTable(list) {
    const rows = (list || []).map(r => ({
      customer: esc(r.customer_name || "—"),
      contact: esc(r.contact_number || "—"),
      total: window.UI.money(r.total_outstanding),
      oldest: window.UI.dateWithTime(r.oldest_challan_date, r.oldest_challan_date),
      oldestKey: window.UI.tsKey(r.oldest_challan_date),
      waiting: (r.max_age_days || 0) + " days",
      bills: r.challan_count || 0,
      actions: `<span class="row-actions">${remindAction(r)}</span>`
    }));
    const container = document.getElementById("followup-table");
    if (container && window.UI.renderTable) {
      window.UI.renderTable(container, rows, [
        {key:"customer",label:"Customer"},{key:"contact",label:"Contact"},
        {key:"total",label:"Total Due (₹)"},{key:"oldest",label:"Oldest Due"},{key:"waiting",label:"Waiting"},
        {key:"bills",label:"Bills"},{key:"actions",label:"Remind"}
      ], { pageSize: 15, sortValue: { oldest: r => r.oldestKey } });
    }
    document.getElementById("followup-count").textContent =
      `Showing ${rows.length} of ${allRows.length} owing customers`;
  }

  window.resetFollowupFilters = function () {
    document.getElementById("followup-search").value = "";
    window.filterFollowup();
  };

  window.filterFollowup = function () {
    const q = (document.getElementById("followup-search").value || "").trim().toLowerCase();
    if (!q) { renderFollowupTable(allRows); return; }
    renderFollowupTable(allRows.filter(r =>
      [r.customer_name, r.contact_number].map(v => String(v == null ? "" : v).toLowerCase()).some(v => v.includes(q))));
  };

  window.loadFollowup = async function () {
    try {
      allRows = await window.UI.api("/reports/dues-followup") || [];
      window.filterFollowup();
    } catch (e) {
      console.error("Followup", e);
      document.getElementById("followup-table").innerHTML = "<p>Failed to load.</p>";
    }
  };

  window.loadFollowup();
  // Searchable dropdown on the filter (click empty box → everything the
  // text search matches: customer names and contact numbers).
  if (window.UI.searchSuggest) {
    window.UI.searchSuggest(document.getElementById("followup-search"), () => {
      const out = new Set();
      (allRows || []).forEach((r) => {
        if (r.customer_name) out.add(String(r.customer_name));
        if (r.contact_number) out.add(String(r.contact_number));
      });
      return Array.from(out);
    });
  }
})();
</script>
