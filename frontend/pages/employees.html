<!-- Employees -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <h2 style="font-size: 18px; font-weight: 600;">Employees</h2>
    <button class="btn btn-primary" onclick="openNewEmployeeForm()">+ Add Employee</button>
  </div>

  <div id="emp-form" style="display:none; border-top:1px solid var(--color-border); padding-top:16px; margin-bottom:16px;">
    <h4 id="emp-form-title" style="font-size:14px; font-weight:600; margin-bottom:12px;">New Employee</h4>
    <form onsubmit="saveEmployee(event)" id="new-emp-form">
      <div class="form-row">
        <div class="form-group"><label>Name</label><input id="emp-name" required /></div>
        <div class="form-group"><label>Phone</label><input id="emp-phone" /></div>
        <div class="form-group"><label>Email</label><input id="emp-email" type="email" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Type</label>
          <select id="emp-type">
            <option value="full_time">Full Time</option>
            <option value="part_time">Part Time</option>
            <option value="contractor">Contractor</option>
          </select>
        </div>
        <div class="form-group"><label>Joining Date</label><input id="emp-join" type="date" /></div>
        <div class="form-group"><label>Salary</label><input id="emp-salary" type="number" step="0.01" min="0" value="0" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Address</label><input id="emp-addr" /></div>
        <div class="form-group"><label>Bank Account</label><input id="emp-acc" /></div>
        <div class="form-group"><label>IFSC</label><input id="emp-ifsc" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>PAN</label><input id="emp-pan" /></div>
        <div class="form-group"><label>Aadhaar</label><input id="emp-aadhaar" /></div>
        <div class="form-group"><label>Status</label>
          <select id="emp-status">
            <option value="active">Active</option>
            <option value="on_leave">On Leave</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Emergency Contact</label><input id="emp-emg" /></div>
        <div class="form-group"><label>Emergency Name</label><input id="emp-emgname" /></div>
        <div class="form-group"><label>Notes</label><input id="emp-notes" /></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary" id="emp-save-btn">Save</button>
        <button type="button" class="btn btn-danger-outline" onclick="cancelEmployeeForm()">Cancel</button>
      </div>
    </form>
    <div id="emp-msg" style="font-size:13px; margin-top:10px; color: var(--color-text-muted);"></div>
  </div>
</div>

<div class="card" id="emp-detail-card" style="display:none;">
  <h3>Employee Details</h3>
  <div id="emp-detail-body" style="font-size:14px; line-height:1.8;"></div>
  <div style="margin-top:10px;">
    <button class="btn btn-danger-outline btn-sm" onclick="document.getElementById('emp-detail-card').style.display='none'">Close</button>
  </div>
</div>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
    <h3 style="margin:0;">Employee List</h3>
    <input id="emp-search" type="search" placeholder="Search name, phone, email, type…"
      oninput="filterEmployees()"
      style="padding:8px 12px; border:1px solid var(--color-border); border-radius:6px; font-size:14px; min-width:240px;" />
    <button class="btn btn-secondary btn-sm" type="button" onclick="resetEmployeeFilters()" title="Clear the search box">↺ Reset</button>
  </div>
  <div id="emp-table"></div>
  <p id="emp-count" style="font-size:12px; color:var(--color-text-muted); margin-top:8px;"></p>
</div>

<script>
(function(){
  let editingEmployeeId = null;
  let allEmployees = [];
  let empSort = { key: null, dir: 1 };

  window.setEmpSort = function (key) {
    if (empSort.key === key) empSort.dir = empSort.dir === 1 ? -1 : 1;
    else { empSort.key = key; empSort.dir = 1; }
    window.filterEmployees();
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderEmployeeTable(list) {
    const container = document.getElementById("emp-table");
    if (!container) return;
    const sorted = (window.UI.sortRows ? window.UI.sortRows(list, empSort.key, empSort.dir) : (list || []));
    const arrow = k => (window.UI.sortArrow ? window.UI.sortArrow(empSort, k) : "");
    const th = (k, label) => `<th onclick="setEmpSort('${k}')" style="cursor:pointer; user-select:none;" title="Sort by ${label}">${label}${arrow(k)}</th>`;
    if (!sorted || !sorted.length) {
      container.innerHTML = "<div class='table-wrap'><table><thead><tr><th></th><th>Name</th><th>Phone</th><th>Type</th><th>Salary</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr><td colspan='7'>No employees found.</td></tr></tbody></table></div>";
    } else {
      let html = `<div class='table-wrap'><table><thead><tr><th></th>${th("name", "Name")}${th("phone", "Phone")}${th("employee_type", "Type")}${th("salary", "Salary")}${th("status", "Status")}<th>Actions</th></tr></thead><tbody>`;
      sorted.forEach(e => {
        html += "<tr>" +
          `<td><button class="btn btn-sm btn-secondary" onclick="toggleEmpDetail(${e.id}, this)" title="Show more details">+</button></td>` +
          `<td>${esc(e.name || "")}</td>` +
          `<td>${esc(e.phone || "—")}</td>` +
          `<td>${esc((e.employee_type || "").replace("_", " "))}</td>` +
          `<td>${window.UI.money(e.salary != null ? e.salary : "0")}</td>` +
          `<td>${esc(e.status || "—")}</td>` +
          `<td><span class="row-actions"><button class="btn btn-sm btn-info" onclick="viewEmployee(${e.id})">View</button><button class="btn btn-sm btn-warn" onclick="editEmployee(${e.id})">Edit</button><button class="btn btn-sm btn-danger" onclick="deleteEmployee(${e.id})">Delete</button></span></td>` +
          "</tr>";
        html += `<tr id="emp-detail-${e.id}" style="display:none; background:#f5f8fc;"><td></td><td colspan="6">${empDetailGrid(e)}</td></tr>`;
      });
      html += "</tbody></table></div>";
      container.innerHTML = html;
    }
    const count = document.getElementById("emp-count");
    if (count) count.textContent = "Showing " + (list || []).length + " of " + allEmployees.length + " employees";
  }

  function empDetailGrid(e) {
    const row = (k, v) => "<span style='color:var(--color-text-muted);'>" + k + "</span><span>" + esc(v == null || v === "" ? "—" : v) + "</span>";
    return "<div style='display:grid; grid-template-columns: 130px 1fr 130px 1fr; gap:4px 12px; padding:8px 0; font-size:13px;'>" +
      row("Employee ID", e.employee_id) + row("Email", e.email) +
      row("Address", e.address) + "<span style='color:var(--color-text-muted);'>Joined</span><span>" + window.UI.dateWithTime(e.joining_date, e.created_at) + "</span>" +
      row("Bank A/c", e.bank_account_no) + row("IFSC", e.ifsc_code) +
      row("PAN", e.pan_no) + row("Aadhaar", e.aadhaar_no) +
      row("Emergency", e.emergency_name) + row("Emg. Contact", e.emergency_contact) +
      "</div>";
  }

  window.toggleEmpDetail = function (id, btn) {
    const detailRow = document.getElementById("emp-detail-" + id);
    if (!detailRow) return;
    const open = detailRow.style.display !== "none";
    detailRow.style.display = open ? "none" : "table-row";
    if (btn) btn.textContent = open ? "+" : "−";
  };

  window.resetEmployeeFilters = function () {
    document.getElementById("emp-search").value = "";
    window.filterEmployees();
  };

  window.filterEmployees = function () {
    const q = (document.getElementById("emp-search").value || "").trim().toLowerCase();
    if (!q) { renderEmployeeTable(allEmployees); return; }
    const filtered = allEmployees.filter(e => [e.name, e.phone, e.email, e.employee_type, e.status, e.employee_id]
      .map(v => String(v == null ? "" : v).toLowerCase()).some(v => v.includes(q)));
    renderEmployeeTable(filtered);
  };

  async function loadEmployees() {
    try {
      const data = await window.UI.api("/employees");
      allEmployees = data || [];
      const q = document.getElementById("emp-search");
      if (q && q.value) { window.filterEmployees(); } else { renderEmployeeTable(allEmployees); }
    } catch (e) {
      console.error("Employees", e);
      document.getElementById("emp-table").innerHTML = "<p>Failed to load.</p>";
    }
  }

  function fillForm(d) {
    document.getElementById("emp-name").value = d.name || "";
    document.getElementById("emp-phone").value = d.phone || "";
    document.getElementById("emp-email").value = d.email || "";
    document.getElementById("emp-type").value = d.employee_type || "full_time";
    document.getElementById("emp-join").value = d.joining_date ? new Date(d.joining_date).toISOString().slice(0, 10) : "";
    document.getElementById("emp-salary").value = (d.salary != null ? d.salary : 0);
    document.getElementById("emp-addr").value = d.address || "";
    document.getElementById("emp-acc").value = d.bank_account_no || "";
    document.getElementById("emp-ifsc").value = d.ifsc_code || "";
    document.getElementById("emp-pan").value = d.pan_no || "";
    document.getElementById("emp-aadhaar").value = d.aadhaar_no || "";
    document.getElementById("emp-status").value = d.status || "active";
    document.getElementById("emp-emg").value = d.emergency_contact || "";
    document.getElementById("emp-emgname").value = d.emergency_name || "";
    document.getElementById("emp-notes").value = d.notes || "";
  }

  window.openNewEmployeeForm = function () {
    editingEmployeeId = null;
    document.getElementById("new-emp-form").reset();
    document.getElementById("emp-form-title").textContent = "New Employee";
    document.getElementById("emp-save-btn").textContent = "Save";
    document.getElementById("emp-msg").textContent = "";
    document.getElementById("emp-form").style.display = "block";
    document.getElementById("emp-name").focus();
  };

  window.cancelEmployeeForm = function () {
    editingEmployeeId = null;
    document.getElementById("new-emp-form").reset();
    document.getElementById("emp-save-btn").textContent = "Save";
    document.getElementById("emp-form-title").textContent = "New Employee";
    document.getElementById("emp-msg").textContent = "";
    document.getElementById("emp-form").style.display = "none";
  };

  window.saveEmployee = async function (event) {
    if (event) event.preventDefault();
    const __release = window.UI.submitGuard(event);
    if (!__release) return;
    window.UI.clearFieldErrors(document.getElementById("new-emp-form"));
    const EMP_FIELDS = { name: "emp-name", phone: "emp-phone", email: "emp-email", employee_type: "emp-type", joining_date: "emp-join", salary: "emp-salary", address: "emp-addr", bank_account_no: "emp-acc", ifsc_code: "emp-ifsc", pan_no: "emp-pan", aadhaar_no: "emp-aadhaar", status: "emp-status", emergency_contact: "emp-emg", emergency_name: "emp-emgname", notes: "emp-notes" };
    let __detail = null;
    const msg = document.getElementById("emp-msg");
    const payload = {
      name: document.getElementById("emp-name").value,
      phone: document.getElementById("emp-phone").value,
      email: document.getElementById("emp-email").value,
      employee_type: document.getElementById("emp-type").value,
      joining_date: document.getElementById("emp-join").value,
      salary: parseFloat(document.getElementById("emp-salary").value) || 0,
      address: document.getElementById("emp-addr").value,
      bank_account_no: document.getElementById("emp-acc").value,
      ifsc_code: document.getElementById("emp-ifsc").value,
      pan_no: document.getElementById("emp-pan").value,
      aadhaar_no: document.getElementById("emp-aadhaar").value,
      status: document.getElementById("emp-status").value,
      emergency_contact: document.getElementById("emp-emg").value,
      emergency_name: document.getElementById("emp-emgname").value,
      notes: document.getElementById("emp-notes").value,
    };
    try {
      let res;
      if (editingEmployeeId == null) {
        res = await fetch("/employees", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      } else {
        res = await fetch("/employees/" + editingEmployeeId, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      }
      const data = await res.json();
      if (!res.ok) { __detail = data.detail; throw new Error(window.UI.formatError(data, "Failed")); }
      msg.textContent = editingEmployeeId == null ? "Employee saved (" + (data.employee_id || "") + ")." : "Employee updated.";
      msg.style.color = "var(--color-success)";
      cancelEmployeeForm();
      document.getElementById("emp-form").style.display = "none";
      loadEmployees();
      __release();
    } catch (e) {
      if (!window.UI.fieldError(document.getElementById("new-emp-form"), __detail, EMP_FIELDS)) {
        msg.textContent = (e.message || "Error");
      } else {
        msg.textContent = "Please fix the highlighted fields.";
      }
      msg.style.color = "var(--color-danger)";
      __release();
    }
  };

  window.viewEmployee = async function (id) {
    const card = document.getElementById("emp-detail-card");
    const body = document.getElementById("emp-detail-body");
    try {
      const d = await window.UI.api("/employees/" + id);
      body.innerHTML =
        "<div style='display:grid; grid-template-columns: 160px 1fr; gap:4px 12px;'>" +
        "<strong>ID</strong><span>" + esc(d.id) + " (" + esc(d.employee_id || "") + ")</span>" +
        "<strong>Name</strong><span>" + esc(d.name) + "</span>" +
        "<strong>Phone</strong><span>" + esc(d.phone || "—") + "</span>" +
        "<strong>Email</strong><span>" + esc(d.email || "—") + "</span>" +
        "<strong>Type</strong><span>" + esc((d.employee_type || "").replace("_", " ")) + "</span>" +
        "<strong>Status</strong><span>" + esc(d.status || "—") + "</span>" +
        "<strong>Joined</strong><span>" + window.UI.dateWithTime(d.joining_date, d.created_at) + "</span>" +
        "<strong>Salary</strong><span>" + window.UI.money(d.salary != null ? d.salary : "0") + "</span>" +
        "<strong>Address</strong><span>" + esc(d.address || "—") + "</span>" +
        "<strong>Bank A/c</strong><span>" + esc(d.bank_account_no || "—") + "</span>" +
        "<strong>IFSC</strong><span>" + esc(d.ifsc_code || "—") + "</span>" +
        "<strong>PAN</strong><span>" + esc(d.pan_no || "—") + "</span>" +
        "<strong>Aadhaar</strong><span>" + esc(d.aadhaar_no || "—") + "</span>" +
        "</div>";
      card.style.display = "block";
      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (e) {
      body.innerHTML = "<p style='color:var(--color-danger)'>Could not load details: " + esc(e.message || e) + "</p>";
      card.style.display = "block";
    }
  };

  window.editEmployee = async function (id) {
    const msg = document.getElementById("emp-msg");
    try {
      const d = await window.UI.api("/employees/" + id);
      editingEmployeeId = id;
      fillForm(d);
      document.getElementById("emp-form-title").textContent = "Edit Employee #" + id;
      document.getElementById("emp-save-btn").textContent = "Update";
      msg.textContent = "Editing employee ID: " + id + " — all saved details loaded below.";
      msg.style.color = "var(--color-primary)";
      document.getElementById("emp-form").style.display = "block";
    document.getElementById("emp-name").focus();
      document.getElementById("emp-detail-card").style.display = "none";
    } catch (e) {
      msg.textContent = "Could not load details: " + (e.message || e);
      msg.style.color = "var(--color-danger)";
    }
  };

  window.deleteEmployee = async function (id) {
    if (!confirm("Deactivate this employee?")) return;
    const msg = document.getElementById("emp-msg");
    try {
      const res = await fetch("/employees/" + id, { method: "DELETE" });
      if (!res.ok) throw new Error("Failed");
      msg.textContent = "Employee deactivated.";
      msg.style.color = "var(--color-success)";
      loadEmployees();
    } catch (e) {
      msg.textContent = "Delete failed.";
      msg.style.color = "var(--color-danger)";
    }
  };

  // Alias for the global Refresh button in the top header.
  window.loadEmployees = loadEmployees;

  loadEmployees();
  // Searchable dropdown on the table filter (click empty box → everything
  // the text search matches: names, phones and employee types).
  if (window.UI.searchSuggest) {
    window.UI.searchSuggest(document.getElementById("emp-search"), () => {
      const out = new Set();
      allEmployees.forEach((e) => {
        if (e.name) out.add(String(e.name));
        if (e.phone) out.add(String(e.phone));
        if (e.employee_type) out.add(String(e.employee_type));
      });
      return Array.from(out);
    });
  }
})();
</script>
