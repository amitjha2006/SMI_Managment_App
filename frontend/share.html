<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Dashboard — Shresth Masala Industry</title>
  <link rel="stylesheet" href="/frontend/css/style.css?v=7" />
</head>
<body style="display:block;">
  <div class="main-wrapper" style="margin-left:0;">
    <header class="top-header">
      <div class="header-left"><h1 style="font-size: 22px;">📊 Shared Dashboard Snapshot</h1></div>
      <div class="header-right"><span class="badge badge-success">Read-only link</span></div>
    </header>
    <main class="main-content">
      <p id="share-meta" style="font-size:13px; color:var(--color-text-muted);"></p>
      <div class="stats-row" id="share-stats" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));"></div>
      <div class="card">
        <h3>🏭 Production That Day</h3>
        <div id="share-prod" style="font-size:14px;"></div>
      </div>
    </main>
  </div>
  <script>
  (function(){
    const fmtRs = n => "₹ " + (parseFloat(n) || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtKg = n => (Math.round((parseFloat(n) || 0) * 1000) / 1000) + " kg";
    // Standalone page (no shared components.js): same DD-Mon-YYYY IST rule,
    // naive server values parsed as IST wall time.
    const fmtShareDate = v => {
      if (v == null || v === "") return "—";
      const s = String(v).trim().replace(" ", "T");
      const d = (/[zZ]$|[+-]\d{2}:?\d{2}$/.test(s)) ? new Date(s) : new Date(s + "+05:30");
      if (isNaN(d.getTime())) return "—";
      const day = d.toLocaleDateString("en-IN", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric" }).replace(/ /g, "-");
      const time = d.toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true }).toUpperCase();
      return `${day}, ${time} IST`;
    };
    const parts = window.location.pathname.split("/");
    const linkId = parts[parts.length - 1];
    const card = (icon, label, value, sub) =>
      `<div class="stat-card"><h4><span class="stat-icon">${icon}</span> ${label}</h4>` +
      `<div class="stat-value" style="font-size:24px;">${value}</div>` +
      (sub ? `<div class="stat-sub">${sub}</div>` : "") + `</div>`;

    fetch("/dashboard/share/" + encodeURIComponent(linkId))
      .then(r => { if (!r.ok) throw new Error("Link not found"); return r.json(); })
      .then(d => {
        const s = d.snapshot || {};
        const st = s.stats || {};
        const sharedAt = d.shared_at ? fmtShareDate(d.shared_at) : "—";
        document.getElementById("share-meta").textContent =
          `Shared by ${s.generated_by || "—"} · snapshot taken ${sharedAt}`;
        document.getElementById("share-stats").innerHTML =
          card("🧂", "Raw Material", fmtKg(st.raw_material_stock_kg), null) +
          card("📦", "Finished Goods", fmtKg(st.finished_goods_kg), (st.finished_goods_packets || 0) + " packets") +
          card("💰", "Sales This Month", fmtRs(st.sales_this_month), null) +
          card("💳", "Customer Outstanding", fmtRs(st.customer_outstanding), "Receivable") +
          card("🧾", "Supplier Payable", fmtRs(st.supplier_payable), "Payable");
        const p = s.production_today || {};
        document.getElementById("share-prod").innerHTML =
          (p.lines && p.lines.length
            ? p.lines.map(l => `<div style="display:flex; justify-content:space-between;"><span>${l.product}</span><strong>${l.kg} kg</strong></div>`).join("") +
              `<div style="display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid var(--color-border);"><span><strong>Total</strong></span><strong>${p.total_kg} kg</strong></div>`
            : "<p style='color:var(--color-text-muted);'>No production that day.</p>");
      })
      .catch(() => {
        document.getElementById("share-meta").textContent = "This share link is invalid.";
      });
  })();
  </script>
</body>
</html>
