<!-- Audit History -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <h2 style="font-size: 18px; font-weight: 600; margin:0;">📜 Audit History</h2>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <select id="audit-module" onchange="loadAudit()">
        <option value="">All modules</option>
        <option value="users">Users</option>
        <option value="payments">Payments</option>
        <option value="purchases">Purchases</option>
        <option value="sales">Sales</option>
        <option value="inventory">Inventory</option>
        <option value="production">Production</option>
        <option value="expenses">Expenses</option>
      </select>
      <select id="audit-action" onchange="loadAudit()">
        <option value="">All actions</option>
        <option value="create">Create</option>
        <option value="update">Update</option>
        <option value="delete">Delete</option>
        <option value="dispatch">Dispatch</option>
        <option value="deliver">Deliver</option>
        <option value="deactivate">Deactivate</option>
        <option value="password_change">Password change</option>
        <option value="adjustment">Stock adjustment</option>
        <option value="opening_stock">Opening stock</option>
        <option value="payment_create">Payment recorded</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="loadAudit()">Refresh</button>
    </div>
  </div>
  <p style="font-size:12px; color:var(--color-text-muted); margin-bottom:12px;">
    Who changed what, and when. Shows the before and after values for money and stock changes.
  </p>
  <div id="audit-table"></div>
  <p id="audit-count" style="font-size:12px; color:var(--color-text-muted); margin-top:8px;"></p>
</div>

<script>
(function(){
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pretty(jsonStr) {
    if (!jsonStr) return "—";
    try { return esc(JSON.stringify(JSON.parse(jsonStr), null, 1)); }
    catch (e) { return esc(jsonStr); }
  }

  function actionBadge(a) {
    return `<span class="badge badge-success">${esc(String(a || "").replace(/_/g, " "))}</span>`;
  }

  async function loadAudit() {
    try {
      const module = document.getElementById("audit-module").value;
      const action = document.getElementById("audit-action").value;
      let qs = "?limit=500";
      if (module) qs += "&module=" + encodeURIComponent(module);
      if (action) qs += "&action=" + encodeURIComponent(action);
      const data = await window.UI.api("/audit-logs" + qs);
      const rows = (data || []).map(r => ({
        at: window.UI.dateWithTime(r.timestamp, r.timestamp),
        atKey: window.UI.tsKey(r.timestamp),
        user: esc(r.user_username || "system"),
        module: esc(r.module),
        action: actionBadge(r.action),
        record: (r.record_type ? esc(r.record_type) : "—") + (r.record_id ? " #" + esc(r.record_id) : ""),
        reference: r.record_label ? esc(r.record_label) : "—",
        detail: `<button class="btn btn-sm btn-info" onclick="showAuditDetail(${r.id})">View</button>`,
      }));
      const container = document.getElementById("audit-table");
      if (container && window.UI.renderTable) {
        window.UI.renderTable(container, rows, [
          {key:"at",label:"Time"},{key:"user",label:"User"},
          {key:"module",label:"Module"},{key:"action",label:"Action"},
          {key:"record",label:"Record"},{key:"reference",label:"Reference"},
          {key:"detail",label:"Changes"}
        ], { sortable: false, pageSize: 15, sortValue: { at: r => r.atKey } });
      }
      document.getElementById("audit-count").textContent = `Showing ${rows.length} entries`;
      window._auditRows = data || [];
    } catch (e) {
      console.error("Audit", e);
      document.getElementById("audit-table").innerHTML = "<p>Failed to load.</p>";
    }
  }
  window.loadAudit = loadAudit;

  window.showAuditDetail = function (id) {
    const r = (window._auditRows || []).find(x => x.id === id);
    if (!r) return;
    window.closeAuditDetail();
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.id = "audit-detail";
    overlay.innerHTML =
      `<div class="modal-card" role="dialog" aria-modal="true" aria-label="Audit entry details">` +
        `<div class="modal-head" data-drag-handle title="Drag to move">` +
          `<h3>${esc(r.action)} · ${esc(r.record_type || "")} ${r.record_id ? "#" + esc(r.record_id) : ""}` +
            (r.record_label ? ` — ${esc(r.record_label)}` : "") +
          `</h3>` +
          `<button class="modal-close" type="button" aria-label="Close" onclick="closeAuditDetail()">&times;</button>` +
        `</div>` +
        `<div class="modal-body">` +
          `<p style="font-size:12px; color:var(--color-text-muted); margin-bottom:10px;">` +
            `by <strong>${esc(r.user_username || "system")}</strong>` +
            (r.timestamp ? ` at ${window.UI.dateWithTime(r.timestamp, r.timestamp)}` : "") +
            (r.ip_address ? ` from ${esc(r.ip_address)}` : "") +
            (r.notes ? ` · ${esc(r.notes)}` : "") +
          `</p>` +
          (r.record_label
            ? `<p style="font-size:12px; margin-bottom:10px;">Reference: <strong>${esc(r.record_label)}</strong>` +
              (r.record_type ? ` <span style="color:var(--color-text-muted)">(${esc(r.record_type)} #${esc(r.record_id)})</span>` : "") +
              `</p>`
            : "") +
          `<div style="display:flex; gap:16px; flex-wrap:wrap;">` +
            `<div style="flex:1; min-width:220px;"><div style="font-size:12px; font-weight:600; margin-bottom:4px;">Before</div>` +
              `<pre style="font-size:11px; background:var(--color-bg); padding:8px; border-radius:6px; white-space:pre-wrap; margin:0;">${pretty(r.old_values)}</pre></div>` +
            `<div style="flex:1; min-width:220px;"><div style="font-size:12px; font-weight:600; margin-bottom:4px;">After</div>` +
              `<pre style="font-size:11px; background:var(--color-bg); padding:8px; border-radius:6px; white-space:pre-wrap; margin:0;">${pretty(r.new_values)}</pre></div>` +
          `</div>` +
        `</div>` +
      `</div>`;
    // clicking the backdrop (but not the card) closes
    overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) window.closeAuditDetail(); });
    // Mount inside #main-content, not body: the router replaces that element's
    // innerHTML on navigation, so the dialog is torn down with the page instead
    // of hanging over the next one. position:fixed still works here because no
    // ancestor of main-content has a transform.
    const host = document.getElementById("main-content") || document.body;
    host.appendChild(overlay);
    const btn = overlay.querySelector(".modal-close");
    if (btn) btn.focus();
  };

  window.closeAuditDetail = function () {
    const el = document.getElementById("audit-detail");
    if (el && el.parentNode) el.parentNode.removeChild(el);
  };

  // Escape closes the dialog. This page's script is re-injected on every visit,
  // so drop the previous listener instead of stacking a new one each time.
  if (window._auditEscHandler) {
    document.removeEventListener("keydown", window._auditEscHandler);
  }
  window._auditEscHandler = function (e) {
    if (e.key === "Escape" && document.getElementById("audit-detail")) window.closeAuditDetail();
  };
  document.addEventListener("keydown", window._auditEscHandler);

  loadAudit();
})();
</script>
