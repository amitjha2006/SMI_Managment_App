<!-- Production History: per-batch, per-material ledger. -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
    <h2 style="font-size: 18px; font-weight: 600; margin:0;">Production History</h2>
    <button class="btn btn-export btn-sm" onclick="window.print()">Print / PDF</button>
  </div>
  <p style="font-size:12px; color:var(--color-text-muted); margin:0 0 12px;">
    Every batch and what it consumed: processed share is the material minus
    its pro-rata part of the batch's stage loss. A negative wastage is shown
    honestly in red, never clamped.
  </p>
  <div class="form-row no-print" style="max-width:760px;">
    <div class="form-group"><label>From</label><input id="rep-ph-from" type="date" /></div>
    <div class="form-group"><label>To</label><input id="rep-ph-to" type="date" /></div>
    <div class="form-group" style="align-self:flex-end; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="loadProductionHistory()">Apply</button>
      <button class="btn btn-secondary btn-sm" onclick="phPreset('month')">This Month</button>
      <button class="btn btn-secondary btn-sm" onclick="phPreset('fy')">This FY</button>
    </div>
  </div>
  <div class="form-row no-print" style="max-width:760px;">
    <div class="form-group"><label>Find material, product or batch</label><input id="ph-search" type="search" placeholder="Type to filter…" oninput="renderPhistory()" autocomplete="off" /></div>
    <div class="form-group"><label>Status</label><select id="ph-status" onchange="renderPhistory()"><option value="">All statuses</option></select></div>
    <div class="form-group" style="align-self:flex-end;"><button class="btn btn-secondary btn-sm" type="button" onclick="resetPhistoryFilters()" title="Clear search, status and the From/To range, then reload">↺ Reset</button></div>
  </div>
</div>

<style>
#rep-phistory th { background: #0e7490; color: #fff; }
#rep-phistory th:nth-child(9), #rep-phistory th:nth-child(10),
#rep-phistory td:nth-child(9), #rep-phistory td:nth-child(10) { background: #0284c7; color: #fff; }
#rep-phistory td:nth-child(9), #rep-phistory td:nth-child(10) { font-weight: 600; }
[data-theme="dark"] #rep-phistory th { background: #164e63; }
[data-theme="dark"] #rep-phistory th:nth-child(9), [data-theme="dark"] #rep-phistory th:nth-child(10),
[data-theme="dark"] #rep-phistory td:nth-child(9), [data-theme="dark"] #rep-phistory td:nth-child(10) { background: #0c4a6e; }
</style>

<div class="card">
  <div id="rep-phistory"></div>
  <p id="rep-phistory-msg" style="font-size:12px; color:var(--color-text-muted); margin-top:8px;"></p>
</div>

<script>
(function(){
  function escPh(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function phLocalISO(d) {
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  // Blank everything the report filters on (search, status, date range) and
  // reload so the server range resets with the boxes.
  window.resetPhistoryFilters = function () {
    document.getElementById("ph-search").value = "";
    document.getElementById("ph-status").value = "";
    document.getElementById("rep-ph-from").value = "";
    document.getElementById("rep-ph-to").value = "";
    loadProductionHistory();
  };

  window.phPreset = function (which) {
    const now = new Date();
    let from;
    if (which === "month") {
      from = new Date(now.getFullYear(), now.getMonth(), 1);
    } else {
      // Financial year: April to March.
      from = new Date(now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1, 3, 1);
    }
    document.getElementById("rep-ph-from").value = phLocalISO(from);
    document.getElementById("rep-ph-to").value = phLocalISO(now);
    loadProductionHistory();
  };

  let lastPhistory = null;

  function statusLabel(s) {
    return String(s || "").split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  }

  /* Newest-first from the server; search + status filter + sortable columns.
     Sr No counts the filtered list, so it stays global across pages. */
  window.renderPhistory = function () {
    const el = document.getElementById("rep-phistory");
    const msg = document.getElementById("rep-phistory-msg");
    if (!el || !lastPhistory) return;
    const q = ((document.getElementById("ph-search") || {}).value || "").trim().toLowerCase();
    const st = (document.getElementById("ph-status") || {}).value || "";
    const kg = n => (parseFloat(n) || 0).toFixed(2) + " Kg";
    const sel = document.getElementById("ph-status");
    const seen = [];
    (lastPhistory.rows || []).forEach(r => {
      if (r.status && !seen.includes(r.status)) seen.push(r.status);
    });
    const keepStatus = sel && [...sel.options].some(o => o.value === st) ? st : "";
    if (sel) {
      sel.innerHTML = '<option value="">All statuses</option>' +
        seen.sort().map(s => `<option value="${escPh(s)}">${escPh(statusLabel(s))}</option>`).join("");
      sel.value = keepStatus;
    }
    const filtered = (lastPhistory.rows || []).filter(r =>
      (!keepStatus || r.status === keepStatus) &&
      (!q || [r.material, r.product, r.production_number]
        .map(v => String(v == null ? "" : v).toLowerCase()).some(v => v.includes(q))));
    const red = v => `<span style="color:var(--color-danger); font-weight:600;">${v}</span>`;
    const rows = filtered.map((r, i) => ({
      sr: i + 1,
      date: window.UI.dateWithTime(r.date, r.created_at),
      dateKey: window.UI.tsKey(r.date, r.created_at),
      batch: escPh(r.production_number || "—"),
      product: escPh(r.product || "—"),
      status: escPh(statusLabel(r.status)),
      material: escPh(r.material || "—"),
      consumed: window.UI.figBox(kg(r.consumed_kg), r.consumed_kg),
      processed: window.UI.figBox(kg(r.processed_kg), r.processed_kg),
      wastage: window.UI.figBox(red(kg(r.wastage_kg)), r.wastage_kg),
      wastage_pct: red((parseFloat(r.wastage_pct) || 0).toFixed(2) + "%"),
    }));
    if (!rows.length) {
      el.innerHTML = "<p>No batches match. Adjust the filters.</p>";
      if (msg) msg.textContent = "";
      return;
    }
    if (window.UI.renderTable) {
      window.UI.renderTable(el, rows, [
        {key:"sr",label:"Sr No"},
        {key:"date",label:"Date"},
        {key:"batch",label:"Batch"},
        {key:"product",label:"Product"},
        {key:"status",label:"Status"},
        {key:"material",label:"Raw Materials"},
        {key:"consumed",label:"Raw Material Kg"},
        {key:"processed",label:"Processed in Kg"},
        {key:"wastage",label:"Wastage in Kg"},
        {key:"wastage_pct",label:"Wastage in %"},
      ], { pageSize: 20, sortValue: { date: r => r.dateKey } });
    }
    if (msg) {
      const t = lastPhistory.totals || {};
      msg.textContent = "Showing " + filtered.length + " of " + (lastPhistory.rows || []).length +
        " lines · " + (t.batches || 0) + " batches · " +
        (lastPhistory.from || "").slice(0, 10) + " to " + (lastPhistory.to || "").slice(0, 10);
    }
  };

  async function loadProductionHistory() {
    const el = document.getElementById("rep-phistory");
    if (!el) return;
    try {
      const params = new URLSearchParams({
        from_date: document.getElementById("rep-ph-from").value || "",
        to_date: document.getElementById("rep-ph-to").value || "",
      });
      lastPhistory = await window.UI.api("/reports/production-history?" + params.toString());
      renderPhistory();
    } catch (e) {
      console.error("Production history", e);
      el.innerHTML = "<p>Could not load the production history.</p>";
    }
  }
  window.loadProductionHistory = loadProductionHistory;

  phPreset("fy");
  // Searchable dropdown on "Find material, product or batch" — lists the
  // distinct materials, products and batch numbers in the current dataset.
  if (window.UI.searchSuggest) {
    window.UI.searchSuggest(document.getElementById("ph-search"), () => {
      const seen = new Set();
      ((lastPhistory && lastPhistory.rows) || []).forEach((r) => {
        [r.material, r.product, r.production_number].forEach((v) => {
          const s = String(v || "").trim();
          if (s) seen.add(s);
        });
      });
      return Array.from(seen).sort();
    });
  }
})();
</script>
