<!-- Raw Materials: stock master plus raw-only adjustments. Split out of the
     combined inventory page so each stock type has its own place. -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <h2 style="font-size: 18px; font-weight: 600;">Raw Material Stock</h2>
    <button class="btn btn-primary" onclick="openNewRawForm()">+ Add Raw Material</button>
  </div>

  <div id="raw-form" style="display:none; border-top:1px solid var(--color-border); padding-top:16px; margin-bottom:16px;">
    <h4 id="raw-form-title" style="font-size:14px; font-weight:600; margin-bottom:12px;">New Raw Material</h4>
    <form onsubmit="saveRawMaterial(event)" id="new-raw-form">
      <div class="form-row">
        <div class="form-group"><label>Material ID (blank = auto)</label><input id="raw-id" placeholder="e.g. RM-3003" /></div>
        <div class="form-group"><label>Material Name</label><input id="raw-name" list="raw-name-list" autocomplete="off" required /><datalist id="raw-name-list"></datalist>
          <small style="display:block; font-size:11px; color:var(--color-text-muted); margin-top:3px;">
            Type to see existing materials — same name in a different unit is kept separate, so check before saving.
          </small>
          <div id="raw-dup-warn" style="display:none; font-size:12px; color:var(--color-warning); margin-top:4px;"></div>
        </div>
        <div class="form-group"><label>Unit</label>
          <select id="raw-unit"><option value="kg">kg</option><option value="gram">gram</option><option value="packet">packet</option><option value="pieces">pieces</option><option value="litres">litres</option><option value="metres">metres</option></select>
        </div>
        <div class="form-group"><label>Category</label>
          <select id="raw-cat"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Opening Stock</label><input id="raw-opening" type="number" step="0.001" value="0" min="0" /></div>
        <div class="form-group"><label>Threshold Stock</label><input id="raw-threshold" type="number" step="0.001" value="0" min="0" /></div>
        <div class="form-group"><label>Reorder Level</label><input id="raw-reorder" type="number" step="0.001" value="0" min="0" /></div>
        <div class="form-group"><label>Purchase Rate</label><div style="display:flex; align-items:stretch; gap:0;"><span class="rupee-prefix">₹</span><input id="raw-rate" type="number" step="0.01" value="0" min="0" class="money-input" style="flex:1; min-width:0;" /></div></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>HSN code</label><input id="raw-hsn" type="text" maxlength="12" list="hsn-raw-list" placeholder="e.g. 09092100 — pick or type" autocomplete="off" /></div>
        <datalist id="hsn-raw-list"></datalist>
        <div class="form-group"><label>Watch stock alerts</label>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; text-transform:none; letter-spacing:0; color:var(--color-text); font-weight:400;">
            <input id="raw-watch" type="checkbox" checked style="width:auto;" /> Flag when low / out of stock
          </label>
        </div>
        <div class="form-group" id="raw-cat-new-wrap" style="display:none;"><label>New category name</label>
          <input id="raw-cat-new" placeholder="New category name" />
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary" id="raw-save-btn">Save Material</button>
        <button type="button" class="btn btn-danger-outline" onclick="cancelRawForm()">Cancel</button>
      </div>
    </form>
    <div id="raw-msg" style="font-size:13px; margin-top:10px; color: var(--color-text-muted);"></div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
    <h3 style="margin:0;">Stock List</h3>
    <input id="raw-search" type="search" placeholder="Search material, category, unit…"
      oninput="filterRaw()"
      style="padding:8px 12px; border:1px solid var(--color-border); border-radius:6px; font-size:14px;" class="search-wide" />
    <button class="btn btn-secondary btn-sm" type="button" onclick="resetRawFilters()" title="Clear the search box">↺ Reset</button>
  </div>
  <div id="raw-table"></div>
  <p id="raw-count" style="font-size:12px; color:var(--color-text-muted); margin-top:8px;"></p>
</div>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <h2 style="font-size: 18px; font-weight: 600;">Stock Adjustments</h2>
    <button class="btn btn-primary" data-approve onclick="openAdjustForm()">+ Adjust Stock</button>
  </div>

  <div id="adj-form" style="display:none; border-top:1px solid var(--color-border); padding-top:16px; margin-bottom:16px;">
    <form onsubmit="saveAdjustment(event)" id="new-adj-form">
      <div class="form-row">
        <div class="form-group"><label>Stock Type</label>
          <input type="hidden" id="adj-kind" value="raw_material" />
          <div style="padding:8px 0; font-weight:600;">Raw Material</div>
        </div>
        <div class="form-group"><label>Item</label><select id="adj-item" required></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Quantity (+ adds, − removes)</label><input id="adj-qty" type="number" step="0.001" required /></div>
        <div class="form-group"><label>Reason</label><input id="adj-reason" list="adj-reason-list" placeholder="e.g. damage, recount" autocomplete="off" required /><datalist id="adj-reason-list"></datalist></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px; align-items:center;">
        <button type="submit" class="btn btn-primary">Save Adjustment</button>
        <button type="button" class="btn btn-danger-outline" onclick="cancelAdjustForm()">Cancel</button>
        <span id="adj-hint" style="font-size:12px; color:var(--color-text-muted);"></span>
      </div>
    </form>
    <div id="adj-msg" style="font-size:13px; margin-top:10px; color: var(--color-text-muted);"></div>
  </div>

  <h3>Adjustment History</h3>
  <div id="adj-table"></div>
</div>

<script>
(function(){
  let allRaw = [];
  let allRawCats = [];
  const NEW_CAT = "__new__";

  // Display-only rounding: stock figures can carry long float tails from
  // arithmetic (e.g. 12.3456789 kg). The screen never shows more than 2
  // decimals; stored values keep full precision.
  const fmtQty2 = n => (n === null || n === undefined || n === "" || isNaN(parseFloat(n)) ? "—"
    : (Math.round(parseFloat(n) * 100) / 100).toLocaleString("en-IN", { maximumFractionDigits: 2 }));

  function wireHsnSuggest(nameId, hsnId, type) {
    const nameEl = document.getElementById(nameId), hsnEl = document.getElementById(hsnId);
    if (!nameEl || !hsnEl || nameEl.dataset.hsnwired) return;
    nameEl.dataset.hsnwired = "1";
    let t = null;
    // Last code filled by the suggester (not the user). A code the user
    // typed by hand is never overwritten; an auto-filled one is refreshed
    // when the name changes instead of sticking forever.
    let lastAuto = "";
    hsnEl.addEventListener("input", () => {
      if (!(hsnEl.value || "").trim()) lastAuto = "";
    });
    nameEl.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(async () => {
        const q = (nameEl.value || "").trim();
        if (q.length < 3) return;
        const cur = (hsnEl.value || "").trim();
        if (cur && cur !== lastAuto) return;
        try {
          const d = await window.UI.api(
            "/hsn-codes/suggest?type=" + type + "&name=" + encodeURIComponent(q));
          if ((nameEl.value || "").trim() !== q) return;
          const now = (hsnEl.value || "").trim();
          if (d && d.code && (!now || now === lastAuto)) { hsnEl.value = d.code; lastAuto = d.code; }
        } catch (e) { /* suggestion is best-effort */ }
      }, 400);
    });
  }

  // Curated HSN picker for the raw-material form. Fetched once; a failure
  // just leaves the box as a free-text input.
  let hsnLoaded = false;
  async function loadHsnPickers() {
    if (hsnLoaded) return;
    try {
      const d = await window.UI.api("/hsn-codes") || {};
      const dl = document.getElementById("hsn-raw-list");
      if (dl) dl.innerHTML = (d.raw_materials || []).map(c =>
        `<option value="${escAdj(c.code)}">${escAdj(c.code)} \u2014 ${escAdj(c.name)}</option>`).join("");
      hsnLoaded = true;
    } catch (e) { console.error("HSN", e); }
  }

  // Raw-material category picker: same "+ New category…" pattern as the
  // product category selects, but backed by /raw-material-categories.
  // Options are built with DOM nodes (not string concat) so a quote in a
  // category name can never break the markup.
  function rawCatOptions(selectedId) {
    const sel = document.getElementById("raw-cat");
    if (!sel) return;
    const keep = sel.value;
    sel.innerHTML = "";
    (allRawCats || []).forEach(c => {
      const o = document.createElement("option");
      o.value = String(c.id);
      o.textContent = c.name;
      sel.appendChild(o);
    });
    const o = document.createElement("option");
    o.value = NEW_CAT; o.textContent = "+ New category…";
    sel.appendChild(o);
    const want = selectedId != null ? String(selectedId) : keep;
    if (want) sel.value = want;
    if (!sel.value) sel.value = "";
    sel.onchange = () => {
      const w = document.getElementById("raw-cat-new-wrap");
      if (w) w.style.display = sel.value === NEW_CAT ? "" : "none";
    };
    if (sel.onchange) sel.onchange();
  }

  async function loadRawCats(selectedId) {
    try {
      allRawCats = await window.UI.api("/raw-material-categories") || [];
    } catch (e) { console.error("Raw categories", e); allRawCats = []; }
    rawCatOptions(selectedId);
  }

  // Turn the picker into what the API expects: the chosen id, a freshly
  // created id for a new name, or null. A 409 (name already exists, e.g.
  // created on another screen) falls back to the existing row.
  async function resolveRawCatId() {
    const sel = document.getElementById("raw-cat");
    const val = sel ? sel.value : "";
    if (val === NEW_CAT) {
      const nm = (document.getElementById("raw-cat-new").value || "").trim();
      if (!nm) return null;
      try {
        const created = await window.UI.api("/raw-material-categories", { method: "POST", body: { name: nm } });
        await loadRawCats(created.id);
        return created.id;
      } catch (e) {
        await loadRawCats();
        const hit = (allRawCats || []).find(c => (c.name || "").toLowerCase() === nm.toLowerCase());
        if (hit) { rawCatOptions(hit.id); return hit.id; }
        throw e;
      }
    }
    return val ? Number(val) : null;
  }

  function renderRawTable(list) {
    // Editor Mode gates every PUT: an enabled-looking checkbox that always
    // reverts reads as broken, so off-mode boxes render disabled with the
    // reason in the tooltip (toggleRawWatch explains again on click).
    const edOff = document.body.classList.contains("editor-off");
    const rows = (list || []).map(r => ({
      material: r.name || r.name,
      category: r.category_name || "—",
      stock: window.UI.figBox(fmtQty2(r.current_stock), r.current_stock),
      unit: r.unit || r.unit,
      threshold: fmtQty2(r.threshold_stock),
      rate: window.UI.money(r.purchase_rate),
      watch: `<input type="checkbox"${r.watch_stock !== false ? " checked" : ""}${edOff ? " disabled" : ""} onclick="toggleRawWatch(${r.id}, this.checked)" title="${edOff ? "Switch Editor Mode on to change Watch" : "Watch low-stock alerts for this material"}" />`,
      actions: `<span class="row-actions"><button class="btn btn-sm btn-warn" onclick="editRaw(${r.id})">Edit</button> <button class="btn btn-sm btn-danger-outline" onclick="deleteRaw(${r.id})">Remove</button></span>`
    }));
    const container = document.getElementById("raw-table");
    if (container && window.UI.renderTable) {
      window.UI.renderTable(container, rows, [{key:"material",label:"Material"},{key:"category",label:"Category"},{key:"stock",label:"Stock"},{key:"unit",label:"Unit"},{key:"threshold",label:"Threshold"},{key:"rate",label:"Rate (₹)"},{key:"watch",label:"Watch"},{key:"actions",label:"Actions"}], { pageSize: 15 });
    }
    const count = document.getElementById("raw-count");
    if (count) count.textContent = "Showing " + rows.length + " of " + allRaw.length + " materials";
  }

  window.resetRawFilters = function () {
    document.getElementById("raw-search").value = "";
    window.filterRaw();
  };

  window.filterRaw = function () {
    const q = (document.getElementById("raw-search").value || "").trim().toLowerCase();
    if (!q) { renderRawTable(allRaw); return; }
    const filtered = allRaw.filter(r => [r.name, r.category_name, r.unit, r.material_id]
      .map(v => String(v == null ? "" : v).toLowerCase()).some(v => v.includes(q)));
    renderRawTable(filtered);
  };

  async function loadRaw() {
    try {
      const data = await window.UI.api("/raw-materials");
      allRaw = data || [];
      renderRawNameSuggestions();
      checkRawDuplicate();
      const q = document.getElementById("raw-search");
      if (q && q.value) { window.filterRaw(); } else { renderRawTable(allRaw); }
    } catch (e) { console.error("Raw", e); document.getElementById("raw-table").innerHTML = "<p>Failed to load.</p>"; }
  }

  const rawNormName = s => String(s == null ? "" : s).trim().replace(/\s+/g, " ").toLowerCase();
  const escRaw = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // Suggest-only duplicate hint. Same name in a different unit stays a
  // separate stock row, so this never merges — it only warns.
  function renderRawNameSuggestions() {
    const dl = document.getElementById("raw-name-list");
    if (!dl) return;
    dl.innerHTML = (allRaw || []).map(m => {
      const sub = [m.unit, m.category_name].filter(Boolean).join(", ");
      return `<option value="${escRaw(m.name || "")}"${sub ? ` label="${escRaw(sub)}"` : ""}></option>`;
    }).join("");
  }

  function findRawDuplicates() {
    const name = rawNormName(document.getElementById("raw-name").value);
    if (!name) return [];
    return (allRaw || []).filter(m => {
      if (editingRawId != null && String(m.id) === String(editingRawId)) return false;
      return rawNormName(m.name) === name;
    });
  }

  function checkRawDuplicate() {
    const warn = document.getElementById("raw-dup-warn");
    if (!warn) return [];
    const dups = findRawDuplicates();
    if (!dups.length || editingRawId != null) { warn.style.display = "none"; warn.textContent = ""; return []; }
    const unit = (document.getElementById("raw-unit").value || "").trim();
    warn.style.display = "block";
    warn.textContent = "Possible duplicate: " + dups.slice(0, 3).map(m =>
      `"${m.name}" (${m.unit || "?" }${m.unit && unit && m.unit !== unit ? " — different unit, kept separate" : ""})`
    ).join("; ") + " — saving creates a separate stock row.";
    return dups;
  }

  let editingRawId = null;

  window.openNewRawForm = function () {
    editingRawId = null;
    document.getElementById("new-raw-form").reset();
    document.getElementById("raw-id").disabled = false;
    document.getElementById("raw-opening").disabled = false;
    document.getElementById("raw-form-title").textContent = "New Raw Material";
    document.getElementById("raw-save-btn").textContent = "Save Material";
    document.getElementById("raw-msg").textContent = "";
    rawCatOptions(null);
    document.getElementById("raw-cat-new").value = "";
    document.getElementById("raw-watch").checked = true;
    document.getElementById("raw-form").style.display = "block";
    document.getElementById("raw-name").focus();
  };

  window.cancelRawForm = function () {
    editingRawId = null;
    document.getElementById("new-raw-form").reset();
    document.getElementById("raw-id").disabled = false;
    document.getElementById("raw-opening").disabled = false;
    document.getElementById("raw-save-btn").textContent = "Save Material";
    document.getElementById("raw-form-title").textContent = "New Raw Material";
    document.getElementById("raw-msg").textContent = "";
    document.getElementById("raw-form").style.display = "none";
  };

  window.saveRawMaterial = async function (event) {
    if (event) event.preventDefault();
    const __release = window.UI.submitGuard(event);
    if (!__release) return;
    const msg = document.getElementById("raw-msg");
    try {
      let res;
      if (editingRawId == null) {
        const dups = checkRawDuplicate();
        if (dups.length && !confirm("Possible duplicate material:\n" +
            dups.slice(0, 3).map(m => `"${m.name}" (${m.unit || "?"})`).join("\n") +
            "\n\nOK = create a separate stock row anyway.\nCancel = go back and check.")) { __release(); return; }
        let matId = document.getElementById("raw-id").value.trim();
        if (!matId) matId = "RM-" + Math.floor(1000 + Math.random() * 9000);
        const payload = {
          material_id: matId,
          name: document.getElementById("raw-name").value,
          category_id: await resolveRawCatId(),
          unit: document.getElementById("raw-unit").value,
          opening_stock: parseFloat(document.getElementById("raw-opening").value) || 0,
          threshold_stock: parseFloat(document.getElementById("raw-threshold").value) || 0,
          reorder_level: parseFloat(document.getElementById("raw-reorder").value) || 0,
          purchase_rate: parseFloat(document.getElementById("raw-rate").value) || 0,
          hsn_code: (document.getElementById("raw-hsn").value || "").trim() || null,
          is_active: true,
          watch_stock: document.getElementById("raw-watch").checked,
        };
        res = await fetch("/raw-materials", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) throw new Error(window.UI.formatError(data, "Failed"));
        msg.textContent = "Material " + (data.material_id || matId) + " saved with opening stock " + (data.opening_stock != null ? data.opening_stock : payload.opening_stock) + ".";
      } else {
        const payload = {
          name: document.getElementById("raw-name").value,
          category_id: await resolveRawCatId(),
          unit: document.getElementById("raw-unit").value,
          threshold_stock: parseFloat(document.getElementById("raw-threshold").value) || 0,
          reorder_level: parseFloat(document.getElementById("raw-reorder").value) || 0,
          purchase_rate: parseFloat(document.getElementById("raw-rate").value) || 0,
          hsn_code: (document.getElementById("raw-hsn").value || "").trim() || null,
          watch_stock: document.getElementById("raw-watch").checked,
        };
        res = await fetch("/raw-materials/" + editingRawId, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) throw new Error(window.UI.formatError(data, "Failed"));
        msg.textContent = "Material updated.";
      }
      msg.style.color = "var(--color-success)";
      cancelRawForm();
      document.getElementById("raw-form").style.display = "none";
      loadRaw();
      __release();
    } catch (e) {
      msg.textContent = (e.message || "Error");
      msg.style.color = "var(--color-danger)";
      __release();
    }
  };

  // Backwards-compatible alias
  window.createRawMaterial = function () { window.saveRawMaterial(); };

  window.editRaw = async function (id) {
    const msg = document.getElementById("raw-msg");
    try {
      const d = await window.UI.api("/raw-materials/" + id);
      editingRawId = id;
      document.getElementById("raw-id").value = d.material_id || "";
      document.getElementById("raw-id").disabled = true;
      document.getElementById("raw-name").value = d.name || "";
      document.getElementById("raw-unit").value = d.unit || "kg";
      document.getElementById("raw-opening").value = (d.opening_stock != null ? d.opening_stock : 0);
      document.getElementById("raw-opening").disabled = true;
      document.getElementById("raw-threshold").value = (d.threshold_stock != null ? d.threshold_stock : 0);
      document.getElementById("raw-reorder").value = (d.reorder_level != null ? d.reorder_level : 0);
      document.getElementById("raw-rate").value = (d.purchase_rate != null ? d.purchase_rate : 0);
      document.getElementById("raw-hsn").value = d.hsn_code || "";
      document.getElementById("raw-watch").checked = d.watch_stock !== false;
      rawCatOptions(d.category_id != null ? d.category_id : null);
      document.getElementById("raw-cat-new").value = "";
      document.getElementById("raw-form-title").textContent = "Edit Raw Material #" + id;
      document.getElementById("raw-save-btn").textContent = "Update";
      msg.textContent = "Editing material ID: " + id + ". (ID and opening stock are locked; current stock changes only via purchases.)";
      msg.style.color = "var(--color-primary)";
      document.getElementById("raw-form").style.display = "block";
    document.getElementById("raw-name").focus();
    } catch (e) {
      msg.textContent = "Could not load details: " + (e.message || e);
      msg.style.color = "var(--color-danger)";
    }
  };

  // One-click Watch toggle: unwatched materials stay usable everywhere
  // but skip low-stock alerts, snapshot badges, and counts.
  window.toggleRawWatch = async function (id, on) {
    const msg = document.getElementById("raw-msg");
    // Answer the click with the reason instead of reverting silently: the
    // server rejects every PUT while Editor Mode is off.
    if (window.App && window.App.isEditorModeOn && !window.App.isEditorModeOn()) {
      window.UI.infoDialog("Editor Mode is off",
        "Switch Editor Mode on (header, next to Refresh) before changing Watch. Records are protected while it is off.");
      loadRaw();
      return;
    }
    try {
      await window.UI.api("/raw-materials/" + id, { method: "PUT", body: { watch_stock: !!on } });
      loadRaw();
    } catch (e) {
      if (msg) {
        msg.textContent = (e && e.message) || "Could not change Watch.";
        msg.style.color = "var(--color-danger)";
      }
      loadRaw();
    }
  };

  window.deleteRaw = async function (id) {    const row = (allRaw || []).find(r => r.id === id);
    const name = (row && row.name) || id;
    if (!confirm(`Remove raw material "${name}"? Past invoices and production entries keep it; it just won't be offered for new ones.`)) return;
    const msg = document.getElementById("raw-msg");
    try {
      // UI.api carries the auth token; a bare fetch does not (see deleteProd).
      await window.UI.api("/raw-materials/" + id, { method: "DELETE" });
      if (msg) {
        msg.textContent = `Removed ${name}.`;
        msg.style.color = "var(--color-success)";
      }
      loadRaw();
    } catch (e) {
      if (msg) {
        msg.textContent = (e && e.message) || "Remove failed.";
        msg.style.color = "var(--color-danger)";
      }
    }
  };

  // Adjustment-reason history: first entry is typed by hand, later
  // adjustments pick from it. A fetch failure leaves a free-text input.
  async function loadAdjReasons() {
    const dl = document.getElementById("adj-reason-list");
    if (!dl) return;
    try {
      const d = await window.UI.api("/stock-adjustments/reasons") || {};
      dl.innerHTML = (d.reasons || []).map(v =>
        `<option value="${escAdj(v)}">`).join("");
    } catch (e) { console.error("Adjustment reasons", e); }
  }

  window.openAdjustForm = function () {
    document.getElementById("new-adj-form").reset();
    document.getElementById("adj-msg").textContent = "";
    document.getElementById("adj-hint").textContent = "";
    document.getElementById("adj-form").style.display = "block";
    document.getElementById("adj-item").focus();
    refreshAdjustItems();
    loadAdjReasons();
  };

  window.cancelAdjustForm = function () {
    document.getElementById("new-adj-form").reset();
    document.getElementById("adj-msg").textContent = "";
    document.getElementById("adj-form").style.display = "none";
  };

  // This page only adjusts raw materials: the kind is fixed, so the item
  // picker can never offer finished goods here.
  window.refreshAdjustItems = function () {
    const itemSel = document.getElementById("adj-item");
    itemSel.innerHTML = '<option value="">Select material…</option>' +
      window.UI.sortByName(allRaw).map(m => `<option value="${m.id}">${escAdj(m.name)} (stock: ${escAdj(window.UI.qty2(m.current_stock != null ? m.current_stock : 0))} ${escAdj(m.unit || "kg")})</option>`).join("");
    document.getElementById("adj-hint").textContent = "Quantity in kg (unit of the material).";
    if (window.UI.quickSelect && !itemSel.parentNode.querySelector(".quickselect-search")) {
      window.UI.quickSelect(itemSel, "Type to find…");
    }
  };

  window.saveAdjustment = async function (event) {
    if (event) event.preventDefault();
    const __release = window.UI.submitGuard(event);
    if (!__release) return;
    const msg = document.getElementById("adj-msg");
    const payload = {
      kind: "raw_material",
      raw_material_id: parseInt(document.getElementById("adj-item").value),
      quantity: parseFloat(document.getElementById("adj-qty").value) || 0,
      reason: document.getElementById("adj-reason").value,
    };
    try {
      const res = await fetch("/stock-adjustments", { method: "POST",
        headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) throw new Error(window.UI.formatError(data, "Failed"));
      msg.textContent = "Adjustment recorded.";
      msg.style.color = "var(--color-success)";
      document.getElementById("adj-form").style.display = "none";
      document.getElementById("new-adj-form").reset();
      loadAdjustments();
      loadRaw();
      __release();
    } catch (e) {
      msg.textContent = (e.message || "Error");
      msg.style.color = "var(--color-danger)";
      __release();
    }
  };

  async function loadAdjustments() {
    try {
      const data = await window.UI.api("/stock-adjustments");
      // Raw page: finished-goods rows belong to the products page.
      const rows = (data || []).filter(a => (a.kind || "") === "Raw Material").map(a => ({
        date: window.UI.dateWithTime(a.date, a.date),
        dateKey: window.UI.tsKey(a.date),
        kind: a.kind || "—",
        item: a.item || "—",
        quantity: window.UI.figBox((a.quantity > 0 ? "+" : "") + (a.quantity != null ? a.quantity : "0") + " " + (a.unit || ""), a.quantity),
        reason: a.reason || "—",
      }));
      const container = document.getElementById("adj-table");
      if (container && window.UI.renderTable) {
        window.UI.renderTable(container, rows, [
          {key:"date",label:"Date"},{key:"kind",label:"Type"},{key:"item",label:"Item"},
          {key:"quantity",label:"Qty"},{key:"reason",label:"Reason"}
        ], { pageSize: 15, sortValue: { date: r => r.dateKey } });
      }
    } catch (e) {
      console.error("Adjustments", e);
      document.getElementById("adj-table").innerHTML = "<p>Failed to load.</p>";
    }
  }

  // Deep-link from the dashboard low-stock spotlight
  // (#/raw-materials?search=<name>): prefill the search box so its table
  // opens already filtered.
  (function applyRawDeepLink() {
    const m = (window.location.hash || "").match(/[?&]search=([^&]*)/);
    if (!m) return;
    const name = decodeURIComponent(m[1].replace(/\+/g, " ")).trim();
    if (!name) return;
    const el = document.getElementById("raw-search");
    if (el) el.value = name;
  })();

  loadHsnPickers();
  loadRawCats();
  loadAdjReasons();
  ["raw-name", "raw-unit"].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el.dataset.dupBound) { el.dataset.dupBound = "1"; el.addEventListener("input", () => checkRawDuplicate()); }
  });
  loadRaw();
  // Searchable dropdown on the table filter (click empty box → everything
  // the text search matches: material names and categories).
  if (window.UI.searchSuggest) {
    window.UI.searchSuggest(document.getElementById("raw-search"), () => {
      const out = new Set();
      allRaw.forEach((r) => {
        if (r.name) out.add(String(r.name));
        if (r.category_name) out.add(String(r.category_name));
      });
      return Array.from(out);
    });
  }
  loadAdjustments();
  wireHsnSuggest("raw-name", "raw-hsn", "raw_material");

  // Editor Mode flips without re-rendering the page, which would leave the
  // Watch boxes disabled-looking after switching on until a manual refresh.
  // Re-render the cached list on that flip only (theme/sidebar classes live
  // elsewhere, so unrelated class churn never reaches the table).
  (function watchEditorFlip() {
    let last = document.body.classList.contains("editor-off");
    new MutationObserver(() => {
      const off = document.body.classList.contains("editor-off");
      if (off !== last) {
        last = off;
        if (document.getElementById("raw-table")) renderRawTable(allRaw);
      }
    }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  })();
})();

function escAdj(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Escape a value used inside an HTML attribute, e.g. a title="..." tooltip.
function escAttr(s) { return escAdj(s); }
</script>
