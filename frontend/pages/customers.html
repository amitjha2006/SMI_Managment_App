<!-- Customers -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <h2 style="font-size: 18px; font-weight: 600;">Customers</h2>
    <button class="btn btn-primary" onclick="openNewCustomerForm()">+ Add Customer</button>
  </div>

  <div id="cust-form" style="display:none; border-top:1px solid var(--color-border); padding-top:16px; margin-bottom:16px;">
    <h4 id="cust-form-title" style="font-size:14px; font-weight:600; margin-bottom:12px;">New Customer</h4>
    <form onsubmit="saveCustomer(event)" id="new-cust-form">
      <div class="form-row">
        <div class="form-group"><label>Name</label><input id="cust-name" list="cust-name-list" autocomplete="off" required /><datalist id="cust-name-list"></datalist>
          <small style="display:block; font-size:11px; color:var(--color-text-muted); margin-top:3px;">
            Type to see existing customers — same name with different contact/GST is a different ledger, so check before saving.
          </small>
          <div id="cust-dup-warn" style="display:none; font-size:12px; color:var(--color-warning); margin-top:4px;"></div>
        </div>
        <div class="form-group"><label>Contact</label><input id="cust-contact" required /></div>
        <div class="form-group"><label>Company</label><input id="cust-company" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input id="cust-email" type="email" /></div>
        <div class="form-group"><label>GST No</label><input id="cust-gst" /></div>
        <div class="form-group"><label>PAN No</label><input id="cust-pan" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Address</label><input id="cust-addr" /></div>
        <div class="form-group"><label>Bank Account</label><input id="cust-acc" /></div>
        <div class="form-group"><label>IFSC</label><input id="cust-ifsc" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Contact 2</label><input id="cust-contact2" /></div>
        <div class="form-group"><label>Bank Name</label><input id="cust-bankname" /></div>
        <div class="form-group"><label>Notes</label><input id="cust-notes" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Opening Balance</label><div style="display:flex; align-items:stretch; gap:0;"><span class="rupee-prefix">₹</span><input id="cust-bal" type="number" step="0.01" value="0" class="money-input" style="flex:1; min-width:0;" /></div></div>
        <div class="form-group"><label>Credit Limit (₹, 0 = unlimited)</label><div style="display:flex; align-items:stretch; gap:0;"><span class="rupee-prefix">₹</span><input id="cust-limit" type="number" step="0.01" min="0" value="0" class="money-input" style="flex:1; min-width:0;" title="Confirming a challan past this outstanding is refused unless Editor Mode is on" /></div></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary" id="cust-save-btn">Save</button>
        <button type="button" class="btn btn-danger-outline" onclick="cancelCustomerForm()">Cancel</button>
      </div>
    </form>
    <div id="cust-msg" style="font-size:13px; margin-top:10px; color: var(--color-text-muted);"></div>
  </div>
</div>

<div class="card" id="cust-detail-card" style="display:none;">
  <h3>Customer Details</h3>
  <div id="cust-detail-body" style="font-size:14px; line-height:1.8;"></div>
  <div style="margin-top:10px;">
    <button class="btn btn-danger-outline btn-sm" onclick="document.getElementById('cust-detail-card').style.display='none'">Close</button>
  </div>
</div>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
    <h3 style="margin:0;">Customer List</h3>
    <input id="cust-search" type="search" placeholder="Search name, company, contact, email, GST…"
      oninput="filterCustomers()"
      style="padding:8px 12px; border:1px solid var(--color-border); border-radius:6px; font-size:14px; min-width:260px;" />
    <button class="btn btn-secondary btn-sm" type="button" onclick="resetCustomerFilters()" title="Clear the search box">↺ Reset</button>
  </div>
  <div id="cust-table"></div>
  <p id="cust-count" style="font-size:12px; color:var(--color-text-muted); margin-top:8px;"></p>
</div>

<script>
(function(){
  // null = create mode, number = editing that customer id
  let editingCustomerId = null;
  let allCustomers = [];
  let custSort = { key: null, dir: 1 };

  window.setCustSort = function (key) {
    if (custSort.key === key) custSort.dir = custSort.dir === 1 ? -1 : 1;
    else { custSort.key = key; custSort.dir = 1; }
    window.filterCustomers();
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function detailGrid(c) {
    const row = (k, v) => "<span style='color:var(--color-text-muted);'>" + k + "</span><span>" + esc(v == null || v === "" ? "—" : v) + "</span>";
    return "<div style='display:grid; grid-template-columns: 130px 1fr 130px 1fr; gap:4px 12px; padding:8px 0; font-size:13px;'>" +
      row("Company", c.company_name) + row("GST", c.gst_no) +
      row("PAN", c.pan_no) + row("Bank A/c", c.account_no) +
      row("IFSC", c.ifsc_code) + row("Outstanding", c.outstanding_balance != null ? c.outstanding_balance : "0") +
      row("Credit Limit", (c.credit_limit != null && parseFloat(c.credit_limit) > 0) ? c.credit_limit : "Unlimited") +
      row("Customer ID", c.customer_id) + row("Contact 2", c.contact_number_2) +
      row("Bank Name", c.bank_detail) + row("Notes", c.notes) +
      "</div>";
  }

  window.toggleCustDetail = function (id, btn) {
    const detailRow = document.getElementById("cust-detail-" + id);
    if (!detailRow) return;
    const open = detailRow.style.display !== "none";
    detailRow.style.display = open ? "none" : "table-row";
    if (btn) btn.textContent = open ? "+" : "−";
  };

  function renderCustomerTable(list) {
    const container = document.getElementById("cust-table");
    if (!container) return;
    const sorted = (window.UI.sortRows ? window.UI.sortRows(list, custSort.key, custSort.dir) : (list || []));
    const arrow = k => (window.UI.sortArrow ? window.UI.sortArrow(custSort, k) : "");
    const th = (k, label) => `<th onclick="setCustSort('${k}')" style="cursor:pointer; user-select:none;" title="Sort by ${label}">${label}${arrow(k)}</th>`;
    if (!sorted || !sorted.length) {
      container.innerHTML = "<div class='table-wrap'><table><thead><tr><th></th><th>Name</th><th>Contact</th><th>Email</th><th>Address</th><th>Opening Bal</th><th>Actions</th></tr></thead><tbody><tr><td colspan='7'>No customers found.</td></tr></tbody></table></div>";
    } else {
      let html = `<div class='table-wrap'><table><thead><tr><th></th>${th("name", "Name")}${th("contact_number", "Contact")}${th("email", "Email")}${th("address", "Address")}${th("opening_balance", "Opening Bal")}<th>Actions</th></tr></thead><tbody>`;
      sorted.forEach(c => {
        const bal = (c.opening_balance != null ? c.opening_balance : (c.outstanding_balance || 0));
        html += "<tr>" +
          `<td><button class="btn btn-sm btn-secondary" onclick="toggleCustDetail(${c.id}, this)" title="Show more details">+</button></td>` +
          `<td>${esc(c.name || "")}</td>` +
          `<td>${esc(c.contact_number || "")}</td>` +
          `<td>${esc(c.email || "—")}</td>` +
          `<td>${esc(c.address || "—")}</td>` +
          `<td>${window.UI.money(bal)}</td>` +
          `<td><span class="row-actions"><button class="btn btn-sm btn-info" onclick="viewCustomer(${c.id})">View</button><button class="btn btn-sm btn-warn" onclick="editCustomer(${c.id})">Edit</button><button class="btn btn-sm btn-danger" onclick="deleteCustomer(${c.id})">Delete</button></span></td>` +
          "</tr>";
        html += `<tr id="cust-detail-${c.id}" style="display:none; background:#f5f8fc;"><td></td><td colspan="6">${detailGrid(c)}</td></tr>`;
      });
      html += "</tbody></table></div>";
      container.innerHTML = html;
    }
    const count = document.getElementById("cust-count");
    if (count) count.textContent = "Showing " + (list || []).length + " of " + allCustomers.length + " customers";
  }

  window.resetCustomerFilters = function () {
    document.getElementById("cust-search").value = "";
    window.filterCustomers();
  };

  window.filterCustomers = function () {
    const q = (document.getElementById("cust-search").value || "").trim().toLowerCase();
    if (!q) { renderCustomerTable(allCustomers); return; }
    const filtered = allCustomers.filter(c => [c.name, c.company_name, c.contact_number, c.email, c.gst_no, c.pan_no, c.address, c.account_no, c.ifsc_code]
      .map(v => String(v == null ? "" : v).toLowerCase()).some(v => v.includes(q)));
    renderCustomerTable(filtered);
  };

  async function loadCustomers() {
    try {
      const data = await window.UI.api("/customers");
      allCustomers = data || [];
      renderCustNameSuggestions();
      checkCustDuplicate();
      // keep any active search applied after reload
      const q = document.getElementById("cust-search");
      if (q && q.value) { window.filterCustomers(); } else { renderCustomerTable(allCustomers); }
    } catch (e) {
      console.error("Customers", e);
      document.getElementById("cust-table").innerHTML = "<p>Failed to load.</p>";
    }
  }

  const normName = s => String(s == null ? "" : s).trim().replace(/\s+/g, " ").toLowerCase();

  // Datalist suggestions + warn-only duplicate hint. Name is not identity
  // (same name, different contact/GST = different ledger), so this never
  // merges — it only surfaces what already exists.
  function renderCustNameSuggestions() {
    const dl = document.getElementById("cust-name-list");
    if (!dl) return;
    dl.innerHTML = (allCustomers || []).map(c => {
      const sub = [c.company_name, c.contact_number, c.gst_no].filter(Boolean).join(", ");
      return `<option value="${esc(c.name || "")}"${sub ? ` label="${esc(sub)}"` : ""}></option>`;
    }).join("");
  }

  function findCustDuplicates() {
    const name = normName(document.getElementById("cust-name").value);
    const contact = (document.getElementById("cust-contact").value || "").trim();
    const gst = (document.getElementById("cust-gst").value || "").trim().toUpperCase();
    if (!name && !contact && !gst) return [];
    return (allCustomers || []).filter(c => {
      if (editingCustomerId != null && String(c.id) === String(editingCustomerId)) return false;
      if (name && normName(c.name) === name) return true;
      if (contact && (c.contact_number || "").trim() === contact) return true;
      if (gst && (c.gst_no || "").trim().toUpperCase() === gst) return true;
      return false;
    });
  }

  function checkCustDuplicate() {
    const warn = document.getElementById("cust-dup-warn");
    if (!warn) return [];
    const dups = findCustDuplicates();
    if (!dups.length || editingCustomerId != null) { warn.style.display = "none"; warn.textContent = ""; return []; }
    warn.style.display = "block";
    warn.textContent = "Possible duplicate: " + dups.slice(0, 3).map(c =>
      `"${c.name}"${c.company_name ? " — " + c.company_name : ""}${c.contact_number ? " (" + c.contact_number + ")" : ""}`
    ).join("; ") + " — saving creates a separate ledger.";
    return dups;
  }

  function fillForm(d) {
    document.getElementById("cust-name").value = d.name || "";
    document.getElementById("cust-company").value = d.company_name || "";
    document.getElementById("cust-contact").value = d.contact_number || "";
    document.getElementById("cust-email").value = d.email || "";
    document.getElementById("cust-gst").value = d.gst_no || "";
    document.getElementById("cust-pan").value = d.pan_no || "";
    document.getElementById("cust-addr").value = d.address || "";
    document.getElementById("cust-acc").value = d.account_no || "";
    document.getElementById("cust-ifsc").value = d.ifsc_code || "";
    document.getElementById("cust-contact2").value = d.contact_number_2 || "";
    document.getElementById("cust-bankname").value = d.bank_detail || "";
    document.getElementById("cust-notes").value = d.notes || "";
    document.getElementById("cust-bal").value = (d.opening_balance != null ? d.opening_balance : 0);
    document.getElementById("cust-limit").value = (d.credit_limit != null ? d.credit_limit : 0);
  }

  window.openNewCustomerForm = function () {
    editingCustomerId = null;
    document.getElementById("new-cust-form").reset();
    document.getElementById("cust-bal").value = "0";
    document.getElementById("cust-limit").value = "0";
    document.getElementById("cust-form-title").textContent = "New Customer";
    document.getElementById("cust-save-btn").textContent = "Save";
    document.getElementById("cust-msg").textContent = "";
    document.getElementById("cust-form").style.display = "block";
    document.getElementById("cust-name").focus();
  };

  window.cancelCustomerForm = function () {
    editingCustomerId = null;
    document.getElementById("new-cust-form").reset();
    document.getElementById("cust-save-btn").textContent = "Save";
    document.getElementById("cust-form-title").textContent = "New Customer";
    document.getElementById("cust-msg").textContent = "";
    document.getElementById("cust-form").style.display = "none";
  };

  // Single submit handler: POST for new, PUT for edit
  window.saveCustomer = async function (event) {
    if (event) event.preventDefault();
    const __release = window.UI.submitGuard(event);
    if (!__release) return;
    window.UI.clearFieldErrors(document.getElementById("new-cust-form"));
    const CUST_FIELDS = { name: "cust-name", company_name: "cust-company", contact_number: "cust-contact", email: "cust-email", gst_no: "cust-gst", pan_no: "cust-pan", address: "cust-addr", account_no: "cust-acc", ifsc_code: "cust-ifsc", contact_number_2: "cust-contact2", bank_detail: "cust-bankname", notes: "cust-notes", opening_balance: "cust-bal", credit_limit: "cust-limit" };
    let __detail = null;
    const payload = {
      name: document.getElementById("cust-name").value,
      company_name: document.getElementById("cust-company").value,
      contact_number: document.getElementById("cust-contact").value,
      email: document.getElementById("cust-email").value,
      gst_no: document.getElementById("cust-gst").value,
      pan_no: document.getElementById("cust-pan").value,
      address: document.getElementById("cust-addr").value,
      account_no: document.getElementById("cust-acc").value,
      ifsc_code: document.getElementById("cust-ifsc").value,
      contact_number_2: document.getElementById("cust-contact2").value,
      bank_detail: document.getElementById("cust-bankname").value,
      notes: document.getElementById("cust-notes").value,
      opening_balance: parseFloat(document.getElementById("cust-bal").value) || 0,
      credit_limit: Math.max(0, parseFloat(document.getElementById("cust-limit").value) || 0),
    };
    const msg = document.getElementById("cust-msg");
    try {
      let res;
      if (editingCustomerId == null) {
        const dups = checkCustDuplicate();
        if (dups.length && !confirm("Possible duplicate customer:\n" +
            dups.slice(0, 3).map(c => `"${c.name}"${c.company_name ? " — " + c.company_name : ""}${c.contact_number ? " (" + c.contact_number + ")" : ""}`).join("\n") +
            "\n\nOK = create a separate ledger anyway.\nCancel = go back and check.")) { __release(); return; }
        res = await fetch("/customers", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      } else {
        res = await fetch("/customers/" + editingCustomerId, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      }
      const data = await res.json();
      if (!res.ok) { __detail = data.detail; throw new Error(window.UI.formatError(data, "Failed")); }
      msg.textContent = editingCustomerId == null ? "Customer saved." : "Customer updated.";
      msg.style.color = "var(--color-success)";
      cancelCustomerForm();
      loadCustomers();
      __release();
    } catch (e) {
      if (!window.UI.fieldError(document.getElementById("new-cust-form"), __detail, CUST_FIELDS)) {
        msg.textContent = (e.message || "Error");
      } else {
        msg.textContent = "Please fix the highlighted fields.";
      }
      msg.style.color = "var(--color-danger)";
      __release();
    }
  };

  // Full details view: answers "how to get the full details of the customer?"
  window.viewCustomer = async function (id) {
    const card = document.getElementById("cust-detail-card");
    const body = document.getElementById("cust-detail-body");
    try {
      const d = await window.UI.api("/customers/" + id);
      body.innerHTML =
        "<div style='display:grid; grid-template-columns: 160px 1fr; gap:4px 12px;'>" +
        "<strong>ID</strong><span>" + esc(d.id) + " (" + esc(d.customer_id || "") + ")</span>" +
        "<strong>Name</strong><span>" + esc(d.name) + "</span>" +
        "<strong>Company</strong><span>" + esc(d.company_name || "—") + "</span>" +
        "<strong>Contact</strong><span>" + esc(d.contact_number || "—") + "</span>" +
        "<strong>Email</strong><span>" + esc(d.email || "—") + "</span>" +
        "<strong>GST</strong><span>" + esc(d.gst_no || "—") + "</span>" +
        "<strong>PAN</strong><span>" + esc(d.pan_no || "—") + "</span>" +
        "<strong>Address</strong><span>" + esc(d.address || "—") + "</span>" +
        "<strong>Bank A/c</strong><span>" + esc(d.account_no || "—") + "</span>" +
        "<strong>IFSC</strong><span>" + esc(d.ifsc_code || "—") + "</span>" +
        "<strong>Contact 2</strong><span>" + esc(d.contact_number_2 || "—") + "</span>" +
        "<strong>Bank Name</strong><span>" + esc(d.bank_detail || "—") + "</span>" +
        "<strong>Notes</strong><span>" + esc(d.notes || "—") + "</span>" +
        "<strong>Opening Bal</strong><span>" + esc(d.opening_balance != null ? d.opening_balance : "0") + "</span>" +
        "<strong>Outstanding</strong><span>" + esc(d.outstanding_balance != null ? d.outstanding_balance : "0") + "</span>" +
        "<strong>Credit Limit</strong><span>" + esc((d.credit_limit != null && parseFloat(d.credit_limit) > 0) ? d.credit_limit : "Unlimited") + "</span>" +
        "</div><div id='cust-statement' style='margin-top:12px; font-size:13px; color:var(--color-text-muted);'>Loading dues…</div>";
      card.style.display = "block";
      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      loadCustomerStatement(id);
    } catch (e) {
      body.innerHTML = "<p style='color:var(--color-danger)'>Could not load details: " + esc(e.message || e) + "</p>";
      card.style.display = "block";
    }
  };

  // Dues statement: open challans with ageing, plus one-tap WhatsApp
  // follow-up (same click-to-chat pattern as the sales invoice share:
  // needs the customer's 10-digit number, sending stays manual).
  window.loadCustomerStatement = async function (id) {
    const el = document.getElementById("cust-statement");
    if (!el) return;
    try {
      const st = await window.UI.api("/customers/" + id + "/statement");
      const rows = (st.challans || []).map(c =>
        `<tr><td>${esc(c.challan_number || "—")}</td>` +
        `<td>${window.UI.dateWithTime(c.challan_date, c.challan_date)}</td>` +
        `<td class="num">₹ ${esc(c.total)}</td>` +
        `<td class="num">₹ ${esc(c.paid)}</td>` +
        `<td class="num">₹ ${esc(c.outstanding)}</td>` +
        `<td class="num">${c.age_days} days</td></tr>`).join("");
      const ag = st.aging || {};
      el.innerHTML =
        `<h4 style="font-size:14px; margin:4px 0 6px;">Dues — ₹ ${esc(st.total_outstanding)} ` +
        `(${(st.challans || []).length} challan${(st.challans || []).length === 1 ? "" : "s"})</h4>` +
        `<div style="font-size:12px; color:var(--color-text-muted); margin-bottom:6px;">` +
        `≤ 30 days: ${ag.d30 || 0} · 31–60 days: ${ag.d60 || 0} · 60+ days: ${ag.over60 || 0}</div>` +
        ((st.challans || []).length
          ? `<div class="table-wrap"><table><thead><tr><th>Challan</th><th>Date</th>` +
            `<th class="num">Total</th><th class="num">Paid</th><th class="num">Due</th><th class="num">Age</th>` +
            `</tr></thead><tbody>${rows}</tbody></table></div>` +
            `<button class="btn btn-sm btn-wa" style="margin-top:8px;" onclick="shareStatement(${st.customer_id})" title="Share this dues statement on WhatsApp">Share on WhatsApp</button>`
          : `<p>Nothing due — no open challans for this customer.</p>`);
    } catch (e) {
      el.innerHTML = "<p>Could not load dues.</p>";
    }
  };

  window.shareStatement = async function (id) {
    try {
      const st = await window.UI.api("/customers/" + id + "/statement");
      let digits = String(st.contact_number || "").replace(/\D/g, "");
      if (digits.length === 10) digits = "91" + digits;
      if (digits.length !== 12) {
        window.UI.infoDialog("No WhatsApp number",
          "This customer has no usable 10-digit phone number. Add it by editing the customer first.");
        return;
      }
      const lines = [
        `${st.customer_name || "Customer"} — dues statement`,
        `Total due: ₹${st.total_outstanding || 0} across ${(st.challans || []).length} challan(s)`,
      ].concat((st.challans || []).map(c =>
        `${c.challan_number}: ₹${c.outstanding} due (${c.age_days} days)`));
      window.open("https://wa.me/" + digits + "?text=" + encodeURIComponent(lines.join("\n")), "_blank");
    } catch (e) {
      window.UI.notify(e.message || "Could not load the statement", "error");
    }
  };

  window.editCustomer = async function (id) {
    const msg = document.getElementById("cust-msg");
    try {
      const d = await window.UI.api("/customers/" + id);
      editingCustomerId = id;
      fillForm(d);
      document.getElementById("cust-form-title").textContent = "Edit Customer #" + id;
      document.getElementById("cust-save-btn").textContent = "Update";
      msg.textContent = "Editing customer ID: " + id + " — all saved details loaded below.";
      msg.style.color = "var(--color-primary)";
      document.getElementById("cust-form").style.display = "block";
    document.getElementById("cust-name").focus();
      document.getElementById("cust-detail-card").style.display = "none";
    } catch (e) {
      msg.textContent = "Could not load details: " + (e.message || e);
      msg.style.color = "var(--color-danger)";
    }
  };

  // Backwards-compatible aliases (old buttons may call these names)
  window.editCust = function (id) { window.editCustomer(id); };
  window.deleteCust = function (id) { window.deleteCustomer(id); };
  window.createCustomer = function () { window.saveCustomer(); };

  window.deleteCustomer = async function (id) {
    if (!confirm("Delete this customer?")) return;
    const msg = document.getElementById("cust-msg");
    try {
      // UI.api carries the auth token; a bare fetch does not and the server
      // answers 401, so deletes used to fail silently every time.
      await window.UI.api("/customers/" + id, { method: "DELETE" });
      msg.textContent = "Customer deleted.";
      msg.style.color = "var(--color-success)";
      loadCustomers();
    } catch (e) {
      msg.textContent = (e && e.message) || "Delete failed.";
      msg.style.color = "var(--color-danger)";
    }
  };

  // Alias for the global Refresh button in the top header.
  window.loadCustomers = loadCustomers;

  if (window.UI.applySearchDeepLink) window.UI.applySearchDeepLink("cust-search");
  // Searchable dropdown on the table filter (click empty box → everything
  // the text search matches: names, companies and contact numbers).
  if (window.UI.searchSuggest) {
    window.UI.searchSuggest(document.getElementById("cust-search"), () => {
      const out = new Set();
      allCustomers.forEach((c) => {
        if (c.name) out.add(String(c.name));
        if (c.company_name) out.add(String(c.company_name));
        if (c.contact_number) out.add(String(c.contact_number));
      });
      return Array.from(out);
    });
  }
  ["cust-name", "cust-contact", "cust-gst"].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el.dataset.dupBound) { el.dataset.dupBound = "1"; el.addEventListener("input", () => checkCustDuplicate()); }
  });
  loadCustomers();
  if (window.location.hash.includes("new=1")) window.openNewCustomerForm();
})();
</script>
