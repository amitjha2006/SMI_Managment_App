        `</div>` +
        `<div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">` +
          `<strong style="font-size:13px;">${window.UI.money(c.outstanding_amount)}</strong>` +
          `<button class="btn btn-sm btn-primary" onclick="closeReceivePaymentPicker(); openPaymentForm(${c.id});">₹ Receive</button>` +
        `</div>` +
      `</div>`).join("");
  };

  window.openPaymentForm = async function (id) {
    const msg = document.getElementById("pay-msg");
    try {
      const d = await window.UI.api("/challans/" + id);
      const st = String(d.status || "").toLowerCase();
      if (st === "draft") {
        window.UI.infoDialog("Payment unavailable",
          "This challan is still a draft. Confirm it first — a draft is not yet a receivable, so no payment can be recorded against it.");
        return;
      }
      const outstanding = parseFloat(d.outstanding_amount) || 0;
      if (outstanding <= 0) {
        window.UI.infoDialog("Payment unavailable",
          "Challan " + (d.challan_number || "") + " is fully paid. There is nothing left to collect.");
        return;
      }
      payChallanId = id;
      resetPayFormMode();
      document.getElementById("pay-challan-no").textContent = d.challan_number || ("#" + id);
      const payDateText = window.UI.fmtDay ? window.UI.fmtDay(d.challan_date) : (d.challan_date || "");
      document.getElementById("pay-challan-info").innerHTML =
        `<strong style="font-size:16px; color:var(--color-text);">${esc(d.customer_name || "—")} · Challan date ${esc(payDateText)}</strong><br>` +
        `<span>Total ₹ ${d.total_price || 0} | Paid ₹ ${d.paid_amount || 0} | Outstanding ₹ ${d.outstanding_amount || 0}</span>`;
      document.getElementById("pay-amount").value = d.outstanding_amount;
      document.getElementById("pay-amount").max = d.outstanding_amount;
      document.getElementById("pay-date").valueAsDate = new Date();
      msg.textContent = "";
      document.getElementById("challan-pay-card").style.display = "block";
      document.getElementById("challan-pay-card").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (e) {
      document.getElementById("challan-msg").textContent = "Could not load challan: " + (e.message || e);
    }
  };

  // Correct a receipt in place: amount, date, mode, ref and notes are
  // editable; the old amount is reversed out of the challan and customer
  // balances by the server. Archived rows stay restore-only.
  window.editChallanPayment = async function (payId, challanId) {
    const msg = document.getElementById("pay-msg");
    try {
      const d = await window.UI.api("/challans/" + challanId);
      const pays = await window.UI.api("/payments/challan/" + challanId) || [];
      const p = pays.find(x => String(x.id) === String(payId));
      if (!p) { window.UI.notify("Payment not found. Reload and try again.", "error"); return; }
      payChallanId = challanId;
      editingPaymentId = payId;
      document.getElementById("pay-card-title").childNodes[0].textContent = "Correct Payment — ";
      document.getElementById("pay-submit-btn").textContent = "Save Changes";
      document.getElementById("pay-challan-no").textContent = d.challan_number || ("#" + challanId);
      const headroom = (parseFloat(d.outstanding_amount) || 0) + (parseFloat(p.amount) || 0);
      document.getElementById("pay-challan-info").innerHTML =
        `<strong style="font-size:16px; color:var(--color-text);">${esc(d.customer_name || "—")} · correcting receipt of ₹ ${p.amount || 0}</strong><br>` +
        `<span>Total ₹ ${d.total_price || 0} | Outstanding ₹ ${d.outstanding_amount || 0} | Headroom ₹ ${headroom.toFixed(2)}</span>`;
      document.getElementById("pay-amount").value = p.amount;
      document.getElementById("pay-amount").max = headroom;
      const pd = p.payment_date ? new Date(p.payment_date) : new Date();
      document.getElementById("pay-date").value = pd.getFullYear() + "-" +
        String(pd.getMonth() + 1).padStart(2, "0") + "-" + String(pd.getDate()).padStart(2, "0");
      document.getElementById("pay-mode").value = p.payment_mode || "cash";
      document.getElementById("pay-ref").value = p.transaction_ref || "";
      document.getElementById("pay-notes").value = p.notes || "";
      msg.textContent = "";
      document.getElementById("challan-pay-card").style.display = "block";
      document.getElementById("challan-pay-card").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (e) {
      msg.textContent = (e.message || "Could not load payment.");
      msg.style.color = "var(--color-danger)";
    }
  };

  window.savePayment = async function (event) {
    if (event) event.preventDefault();
    const __release = window.UI.submitGuard(event);
    if (!__release) return;
    const msg = document.getElementById("pay-msg");
    if (editingPaymentId != null) {
      try {
        const res = await fetch("/payments/" + editingPaymentId, { method: "PUT",
          headers: {"Content-Type":"application/json"}, body: JSON.stringify({
            amount: parseFloat(document.getElementById("pay-amount").value) || 0,
            payment_date: document.getElementById("pay-date").value,
            payment_mode: document.getElementById("pay-mode").value,
            transaction_ref: document.getElementById("pay-ref").value,
            notes: document.getElementById("pay-notes").value,
          }) });
        const data = await res.json();
        if (!res.ok) throw new Error(window.UI.formatError(data, "Failed"));
        msg.textContent = "Payment corrected to ₹ " + (data.amount || "") + ". Outstanding: ₹ " + (data.outstanding_after != null ? data.outstanding_after : "0");
        msg.style.color = "var(--color-success)";
        const doneId = payChallanId;
        resetPayFormMode();
        document.getElementById("pay-form").reset();
        document.getElementById("challan-pay-card").style.display = "none";
        loadChallans();
        if (doneId) viewChallan(doneId);
        __release();
      } catch (e) {
        msg.textContent = (e.message || "Error");
        msg.style.color = "var(--color-danger)";
        __release();
      }
      return;
    }
    const payload = {
      challan_id: payChallanId,
      amount: parseFloat(document.getElementById("pay-amount").value) || 0,
      payment_date: document.getElementById("pay-date").value,
      payment_mode: document.getElementById("pay-mode").value,
      transaction_ref: document.getElementById("pay-ref").value,
      notes: document.getElementById("pay-notes").value,
    };
    try {
      const res = await fetch("/payments", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) throw new Error(window.UI.formatError(data, "Failed"));
      msg.textContent = "Payment of ₹ " + (data.amount || "") + " recorded. Outstanding: ₹ " + (data.outstanding_after != null ? data.outstanding_after : "0");
      msg.style.color = "var(--color-success)";
      document.getElementById("pay-form").reset();
      document.getElementById("challan-pay-card").style.display = "none";
      loadChallans();
      __release();
    } catch (e) {
      msg.textContent = (e.message || "Error");
      msg.style.color = "var(--color-danger)";
      __release();
    }
  };

  // Published on window: the "Show archived" checkbox calls loadChallans()
  // from an inline onchange, and inline handlers are evaluated in the global
  // scope, where an IIFE-local function is not visible (ReferenceError).
  window.loadChallans = loadChallans;

  restoreChallanFilters();
  loadCustomers();
  loadProducts();
  if (window.UI.applySearchDeepLink) window.UI.applySearchDeepLink("challan-search");
  // Searchable dropdown on the table filter: click the empty box to see
  // every challan number, customer and status, type to narrow, pick to
  // filter. The list mirrors everything the text search matches below, so a
  // dropdown pick always filters the same rows manual typing would.
  if (window.UI.searchSuggest) {
    window.UI.searchSuggest(document.getElementById("challan-search"), () => {
      const out = new Set();
      allChallans.forEach((c) => {
        if (c.challan_number) out.add(String(c.challan_number));
        if (c.customer_name) out.add(String(c.customer_name));
        if (c.status) out.add(String(c.status).toLowerCase());
      });
      return Array.from(out);
    });
  }
  const firstChallansLoad = loadChallans();
  if (window.location.hash.includes("new=1")) window.openNewChallanForm();
  // Global-search direct open: #/challans?challan=<id>&payment=<receipt-id>.
  (function () {
    const h = window.location.hash || "";
    const pay = (h.match(/[?&]payment=(\d+)/) || [])[1];
    const ch = (h.match(/[?&]challan=(\d+)/) || [])[1];
    if (pay && ch) window.viewChallan(parseInt(ch, 10), parseInt(pay, 10));
  })();
  // Dashboard "+ Receive Payment" shortcut: open the pending-challan
  // chooser once that same first load has its rows (no extra fetch).
  if (window.location.hash.includes("receive=1") && !isChallanEntry()) {
    firstChallansLoad.then(() => { try { window.openReceivePaymentPicker(); } catch (e) {} });
  }
})();
</script>
