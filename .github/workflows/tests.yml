# CI: full pytest suite on every push and pull request.
# Ruff is informational only (continue-on-error) until the remaining
# stylistic findings (late imports, os.path, test literals) are triaged;
# pytest is the required gate and is fully green (469 tests).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Lint (informational)
        continue-on-error: true
        run: python -m ruff check . --statistics
