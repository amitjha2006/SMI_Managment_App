<!-- Purchase Summary: per-material confirmed purchases in range. -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
    <h2 style="font-size: 18px; font-weight: 600; margin:0;">Purchase Summary</h2>
    <button class="btn btn-export btn-sm" onclick="window.print()">Print / PDF</button>
  </div>
  <p style="font-size:12px; color:var(--color-text-muted); margin:0 0 12px;">
    Confirmed purchase invoices in range, per material. Drafts and archived
    invoices never count.
  </p>
  <div class="form-row no-print" style="max-width:760px;">
    <div class="form-group"><label>From</label><input id="rep-pu-from" type="date" /></div>
    <div class="form-group"><label>To</label><input id="rep-pu-to" type="date" /></div>
    <div class="form-group" style="flex:2;"><label>Find material</label><select id="pusum-search" onchange="renderPusum()"><option value="">All materials</option></select></div>
  </div>
  <div class="form-row no-print" style="max-width:760px;">
    <div class="form-group" id="pusum-actions" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <button class="btn btn-primary btn-sm" onclick="loadPurchaseSummary()">Apply</button>
      <button class="btn btn-secondary btn-sm" onclick="pusumPreset('month')">This Month</button>
      <button class="btn btn-secondary btn-sm" onclick="pusumPreset('fy')">This FY</button>
      <button class="btn btn-secondary btn-sm" id="pusum-show-selected" onclick="pusumShowSelected()">Show selected only</button>
      <button class="btn btn-secondary btn-sm" id="pusum-reset" onclick="pusumReset()" title="Reset dates, search and hidden rows">Reset</button>
    </div>
  </div>
</div>

<style>
/* In-cell bars: quantity pink, amount blue, scaled to the column max. */
#rep-pusum th { background: #c55a11; color: #fff; }
.bar-cell { position: relative; display: block; }
.bar-cell .bar-fill { position: absolute; top: 0; bottom: 0; left: 0; opacity: 0.55; }
.bar-cell .bar-qty { background: #ec4899; }
.bar-cell .bar-amt { background: #38bdf8; }
.bar-cell .bar-val { position: relative; z-index: 1; font-weight: 600; }
[data-theme="dark"] #rep-pusum th { background: #7c3a12; }
[data-theme="dark"] .bar-cell .bar-qty { background: #9d2463; opacity: 0.8; }
[data-theme="dark"] .bar-cell .bar-amt { background: #0c5d86; opacity: 0.8; }
@media print {
  #rep-pusum th:first-child, #rep-pusum td:first-child { display: none; }
}
</style>

<div class="card">
  <div id="rep-pusum"></div>
  <p id="rep-pusum-msg" style="font-size:12px; color:var(--color-text-muted); margin-top:8px;"></p>
</div>

<script>
(function(){
  function escPu(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pusumLocalISO(d) {
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  window.pusumPreset = function (which) {
    const now = new Date();
    let from;
    if (which === "month") {
      from = new Date(now.getFullYear(), now.getMonth(), 1);
    } else {
      // Financial year: April to March.
      from = new Date(now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1, 3, 1);
    }
    document.getElementById("rep-pu-from").value = pusumLocalISO(from);
    document.getElementById("rep-pu-to").value = pusumLocalISO(now);
    loadPurchaseSummary();
  };

  const HIDE_KEY = "pusum_hidden";
  function loadHidden() {
    try { return new Set(JSON.parse(localStorage.getItem(HIDE_KEY) || "[]")); }
    catch (e) { return new Set(); }
  }
  function saveHidden(set) {
    try { localStorage.setItem(HIDE_KEY, JSON.stringify([...set])); } catch (e) {}
  }

  let lastPusum = null;

  // "Find material" is a searchable dropdown: every loaded material becomes
  // an option, the empty box drops the full list on click, typing filters
  // it (UI.quickSelect). Rebuilt after every fetch so it tracks the table.
  function fillPusumSearch() {
    const sel = document.getElementById("pusum-search");
    if (!sel || !lastPusum) return;
    const prev = sel.value || "";
    const names = [...new Set((lastPusum.rows || []).map(r => r.name || "").filter(Boolean))].sort();
    sel.innerHTML = `<option value="">All materials (${names.length})</option>` +
      names.map(n => `<option value="${escPu(n).toLowerCase()}">${escPu(n)}</option>`).join("");
    if (prev) {
      const still = names.some(n => n.toLowerCase() === prev);
      if (still) sel.value = prev;
    }
    if (window.UI && window.UI.quickSelect) {
      window.UI.quickSelect(sel, "Type to find material…");
    }
  }

  window.pusumShowSelected = function () {
    const hidden = loadHidden();
    document.querySelectorAll('#rep-pusum input[data-pusum]').forEach(cb => {
      if (cb.checked) hidden.delete(cb.dataset.pusum);
      else hidden.add(cb.dataset.pusum);
    });
    saveHidden(hidden);
    renderPusum();
  };

  window.pusumReset = function () {
    saveHidden(new Set());
    const s = document.getElementById("pusum-search");
    if (s) s.value = "";
    // Reset blanks the dates (the server falls back to the FY range) and
    // reloads, not just list filters.
    document.getElementById("rep-pu-from").value = "";
    document.getElementById("rep-pu-to").value = "";
    loadPurchaseSummary();
  };

  /* Totals follow the visible rows only; bars scale to the visible max. */
  window.renderPusum = function () {
    const el = document.getElementById("rep-pusum");
    const msg = document.getElementById("rep-pusum-msg");
    if (!el || !lastPusum) return;
    const hidden = loadHidden();
    // Dropdown pick filters by exact material ("All materials" = no filter).
    const q = ((document.getElementById("pusum-search") || {}).value || "").trim().toLowerCase();
    const visibleRows = (lastPusum.rows || []).filter(r =>
      !hidden.has(r.name || "") && (!q || (r.name || "").toLowerCase() === q));
    const kg = n => (parseFloat(n) || 0).toFixed(2) + " Kg";
    const rs = n => "₹ " + (parseFloat(n) || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const maxQty = Math.max.apply(null, visibleRows.map(r => parseFloat(r.purchased_kg) || 0).concat([0]));
    const maxAmt = Math.max.apply(null, visibleRows.map(r => parseFloat(r.purchase_amount) || 0).concat([0]));
    const bar = (cls, val, max, text) =>
      `<span class="bar-cell"><span class="bar-fill ${cls}" style="width:${max > 0 ? Math.round(val / max * 100) : 0}%"></span>` +
      `<span class="bar-val">${text}</span></span>`;
    const rows = visibleRows.map((r, i) => ({
      sr: i + 1,
      show: `<input type="checkbox" data-pusum="${escPu(r.name)}"${hidden.has(r.name || "") ? "" : " checked"} title="Show/hide this material" />`,
      name: escPu(r.name || "—"),
      qty: bar("bar-qty", parseFloat(r.purchased_kg) || 0, maxQty, kg(r.purchased_kg)),
      amount: bar("bar-amt", parseFloat(r.purchase_amount) || 0, maxAmt, rs(r.purchase_amount)),
    }));
    if (!rows.length) {
      el.innerHTML = "<p>No materials match. Adjust the search or press Reset.</p>";
      if (msg) msg.textContent = "";
      return;
    }
    const sumQty = visibleRows.reduce((s, r) => s + (parseFloat(r.purchased_kg) || 0), 0);
    const sumAmt = visibleRows.reduce((s, r) => s + (parseFloat(r.purchase_amount) || 0), 0);
    rows.push({
      sr: "",
      show: "",
      name: "<strong>Total</strong>",
      qty: "<strong>" + window.UI.figBox(kg(sumQty), sumQty) + "</strong>",
      amount: "<strong>" + window.UI.figBox(rs(sumAmt), sumAmt) + "</strong>",
    });
    if (window.UI.renderTable) {
      window.UI.renderTable(el, rows, [
        {key:"sr",label:"Sr No"},
        {key:"show",label:"Show"},
        {key:"name",label:"Raw Material"},
        {key:"qty",label:"Purchased in KG"},
        {key:"amount",label:"Total Purchase Amount"},
      ]);
    }
    el.querySelectorAll("input[data-pusum]").forEach(cb => {
      cb.addEventListener("change", () => {
        const h = loadHidden();
        if (cb.checked) h.delete(cb.dataset.pusum);
        else h.add(cb.dataset.pusum);
        saveHidden(h);
        renderPusum();
      });
    });
    if (msg) {
      const total = (lastPusum.rows || []).length;
      msg.textContent = "Showing " + visibleRows.length + " of " + total +
        " material" + (total === 1 ? "" : "s") +
        " · " + (lastPusum.from || "").slice(0, 10) + " to " + (lastPusum.to || "").slice(0, 10);
    }
  };

  async function loadPurchaseSummary() {
    const el = document.getElementById("rep-pusum");
    if (!el) return;
    try {
      const params = new URLSearchParams({
        from_date: document.getElementById("rep-pu-from").value || "",
        to_date: document.getElementById("rep-pu-to").value || "",
      });
      lastPusum = await window.UI.api("/reports/purchase-summary?" + params.toString());
      fillPusumSearch();
      renderPusum();
    } catch (e) {
      console.error("Purchase summary", e);
      el.innerHTML = "<p>Could not load the purchase summary.</p>";
    }
  }
  window.loadPurchaseSummary = loadPurchaseSummary;

  pusumPreset("fy");
})();
</script>
