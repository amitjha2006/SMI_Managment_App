<!-- Backup -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <h2 style="font-size: 18px; font-weight: 600;">Backup</h2>
    <button class="btn btn-primary" id="backup-now-btn" onclick="createBackup()">Backup Now + Save As…</button>
  </div>
  <p style="color: var(--color-text-muted); font-size: 13px;">Creates a full copy of the database in the backup folder (Settings &rsaquo; Backups), then asks where to save that copy — e.g. a pen drive. The History below always keeps the in-app copy.</p>
  <div id="backup-msg" style="font-size:13px; margin-top:10px; color: var(--color-text-muted);"></div>
</div>

<div class="card">
  <h3>Backup History</h3>
  <div id="backup-table"></div>
  <p id="backup-count" style="font-size:12px; color:var(--color-text-muted); margin-top:8px;"></p>
</div>

<script>
(function(){
  function fmtSize(bytes) {
    bytes = parseInt(bytes) || 0;
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  function renderBackupTable(list) {
    const rows = (list || []).map(b => ({
      date: window.UI.dateWithTime(b.backup_date, b.created_at),
      dateKey: window.UI.tsKey(b.backup_date || b.created_at),
      file: b.filename || "",
      size: fmtSize(b.file_size),
      actions: `<span class="row-actions"><button class="btn btn-sm btn-export" onclick="downloadBackup(${b.id}, '${(b.filename || "").replace(/'/g, "\\'")}', false)">Download</button><button class="btn btn-sm btn-export" onclick="downloadBackup(${b.id}, '${(b.filename || "").replace(/'/g, "\\'")}', true)">Download + Key</button><button class="btn btn-sm btn-restore" onclick="restoreBackup(${b.id}, '${(b.filename || "").replace(/'/g, "\\'")}')">Restore</button><button class="btn btn-sm btn-danger" onclick="deleteBackup(${b.id})">Delete</button></span>`
    }));
    const container = document.getElementById("backup-table");
    if (container && window.UI.renderTable) {
      window.UI.renderTable(container, rows, [
        {key:"date",label:"Date"},{key:"file",label:"File"},{key:"size",label:"Size"},{key:"actions",label:"Actions"}
      ], { sortValue: { date: r => r.dateKey } });
    }
    const count = document.getElementById("backup-count");
    if (count) count.textContent = "Showing " + rows.length + " backups";
  }

  async function loadBackups() {
    try {
      const data = await window.UI.api("/backup/records");
      renderBackupTable(data || []);
      if (window.App && window.App.refreshBackupStatus) window.App.refreshBackupStatus();
    } catch (e) {
      console.error("Backups", e);
      document.getElementById("backup-table").innerHTML = "<p>Failed to load.</p>";
    }
  }

  window.createBackup = async function () {
    const msg = document.getElementById("backup-msg");
    const btn = document.getElementById("backup-now-btn");
    try {
      if (window.UI.setLoading) window.UI.setLoading(btn, true);
      msg.textContent = "Creating backup...";
      const data = await window.UI.api("/backup/create", { method: "POST" });
      msg.textContent = "Backup saved: " + (data.filename || "") + " (" + fmtSize(data.file_size) + "). Choose where to keep a copy…";
      msg.style.color = "var(--color-success)";
      loadBackups();
      // Save-as: hand the fresh copy to the user wherever they want it.
      // Cancelling the dialog is fine — the History below keeps the copy.
      try {
        await window.downloadBackup(data.id, data.filename || "backup.db", false);
      } catch (e) { /* history copy already saved; nothing more to say */ }
    } catch (e) {
      msg.textContent = (e.message || "Error");
      msg.style.color = "var(--color-danger)";
    } finally {
      if (window.UI.setLoading) window.UI.setLoading(btn, false);
    }
  };

  window.downloadBackup = async function (id, filename, includeSecret) {
    try {
      const url = "/backup/download/" + id + (includeSecret ? "?include_secret=true" : "");
      await window.UI.download(url, filename || "backup.db");
    } catch (e) {
      window.UI.notify(e.message || "Download failed", "error");
    }
  };

  window.deleteBackup = async function (id) {
    if (!confirm("Delete this backup file?")) return;
    const msg = document.getElementById("backup-msg");
    try {
      await window.UI.api("/backup/records/" + id, { method: "DELETE" });
      msg.textContent = "Backup deleted.";
      msg.style.color = "var(--color-success)";
      loadBackups();
    } catch (e) {
      msg.textContent = "Delete failed: " + (e.message || "Error");
      msg.style.color = "var(--color-danger)";
    }
  };

  window.restoreBackup = async function (id, filename) {
    const useCustomPath = confirm("Restore from " + filename + "?\n\n" +
      "Click OK to restore to LIVE database (requires app restart).\n" +
      "Click Cancel to choose a CUSTOM PATH (creates a copy without affecting live data).");
    
    let targetPath = null;
    if (!useCustomPath) {
      targetPath = prompt("Enter custom restore path (relative to app folder):\n\n" +
        "Examples:\n" +
        "  data/restored_20241002.db\n" +
        "  data/backups/test_restore.db\n" +
        "  data/analysis_copy.db\n\n" +
        "Path must be under data/ or backups/ folder and end with .db",
        "data/restored_" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + ".db"
      );
      if (!targetPath) return; // User cancelled
      targetPath = targetPath.trim();
    }
    
    const msg = document.getElementById("backup-msg");
    const action = useCustomPath ? "Restoring to live DB..." : "Restoring to " + targetPath + "...";
    try {
      msg.textContent = action;
      msg.style.color = "var(--color-text-muted)";
      const body = targetPath ? { target_path: targetPath } : {};
      const data = await window.UI.api("/backup/restore/" + id, { 
        method: "POST",
        body: body
      });
      
      if (targetPath) {
        msg.textContent = "Restored to " + data.restored_to + ". Secret key: " + data.secret_key + ". " + data.message;
      } else {
        msg.textContent = "Restored from " + (data.restored_file || "") + ". Safety copy: " + (data.safety_backup || "") + ". Please restart the app now.";
      }
      msg.style.color = "var(--color-success)";
      loadBackups();
      if (window.App) window.App.navigate();
    } catch (e) {
      msg.textContent = (e.message || "Restore failed");
      msg.style.color = "var(--color-danger)";
    }
  };

  // Alias for the global Refresh button in the top header.
  window.loadBackup = loadBackups;

  loadBackups();
})();
</script>
