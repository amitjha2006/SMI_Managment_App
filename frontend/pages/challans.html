<!-- Challans -->
<style>
/* Printable A4 delivery challan.
   Hidden on screen; when printing it becomes the only thing on the page, so the
   document is the challan alone rather than a screenshot of the app. */
#challan-print { display: none; }

#challan-print .cp-sheet { color: #111; font-size: 12px; line-height: 1.45; }
#challan-print .cp-head { display: flex; align-items: flex-start; gap: 16px;
  border-bottom: 2px solid #111; padding-bottom: 10px; }
#challan-print .cp-head img { width: 140px; height: 108px; object-fit: contain; object-position: left center; }
#challan-print .cp-co { flex: 1; }
#challan-print .cp-co h1 { font-size: 19px; font-weight: 700; margin: 0 0 3px; letter-spacing: .3px; }
#challan-print .cp-co .cp-line { font-size: 11px; }
#challan-print .cp-gst { font-weight: 700; }
#challan-print .cp-title { text-align: center; margin: 12px 0 10px; }
#challan-print .cp-title .cp-kind { font-size: 15px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; }
  #challan-print .cp-title .cp-no { font-size: 12px; margin-top: 2px; }
  /* The "not a tax invoice" line. Boxed and italic so it reads as a status
     note about the document rather than as part of the customer's details. */
  #challan-print .cp-notinv { margin-top: 6px; font-size: 10px; font-style: italic;
    color: #444; border: 1px solid #999; padding: 3px 6px; display: inline-block; }
#challan-print .cp-parties { display: flex; gap: 14px; margin-bottom: 10px; }
#challan-print .cp-party { flex: 1; border: 1px solid #bbb; padding: 8px 10px; }
#challan-print .cp-party h4 { font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; margin: 0 0 4px; color: #444; }
#challan-print table { width: 100%; border-collapse: collapse; }
#challan-print th, #challan-print td { border: 1px solid #999; padding: 5px 6px; }
#challan-print th { background: #eee; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
#challan-print .num { text-align: right; font-variant-numeric: tabular-nums; }
#challan-print tfoot td { font-weight: 700; background: #f4f4f4; }
#challan-print .cp-words { margin-top: 10px; font-size: 12px; }
#challan-print .cp-words b { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
#challan-print .cp-signs { display: flex; gap: 30px; margin-top: 34px; }
#challan-print .cp-sign { flex: 1; border-top: 1px solid #111; padding-top: 4px; font-size: 11px; }
#challan-print .cp-terms { margin-top: 14px; padding-top: 8px;
  border-top: 1px dashed #999; font-size: 10px; color: #333; }
#challan-print .cp-warn { color: #a00; font-style: italic; }

/* --- Sales tax invoice (a different document from the challan) ------------
   Separate styles rather than reusing .cp-*, because a tax invoice is
   structured differently: it carries the HSN, the GST rate, and a tax breakup
   (CGST/SGST or IGST) that a delivery challan never shows. */
#invoice-print { display: none; }
#invoice-print .ip-sheet { color: #111; font-size: 12px; line-height: 1.45; }
#invoice-print .ip-head { display: flex; align-items: flex-start; gap: 16px; }
#invoice-print .ip-head img { width: 140px; height: 108px; object-fit: contain;
  object-position: left center; }
#invoice-print .ip-co { flex: 1; }
#invoice-print .ip-co h1 { font-size: 19px; font-weight: 700; margin: 0 0 3px;
  letter-spacing: .2px; }
#invoice-print .ip-line { font-size: 11px; }
#invoice-print .ip-gst { font-weight: 700; }
#invoice-print .ip-title { text-align: center; margin: 12px 0 10px; }
#invoice-print .ip-title .ip-kind { font-size: 16px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; }
#invoice-print .ip-title .ip-taxdoc { font-size: 10px; font-style: italic; color: #444; }
#invoice-print .ip-no { font-size: 12px; margin-top: 3px; }
#invoice-print .ip-parties { display: flex; gap: 14px; margin-bottom: 10px; }
#invoice-print .ip-party { flex: 1; border: 1px solid #bbb; padding: 8px 10px; }
#invoice-print .ip-party h4 { font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; margin: 0 0 4px; color: #444; }
#invoice-print .ip-cust-name { font-size: 14px; font-weight: 700; color: #111;
  margin: 0 0 4px; line-height: 1.3; }
#invoice-print table { width: 100%; border-collapse: collapse; }
#invoice-print th, #invoice-print td { border: 1px solid #999; padding: 5px 6px; }
#invoice-print th { background: #eee; font-size: 10px; text-transform: uppercase; letter-spacing: .3px; }
#invoice-print .num { text-align: right; font-variant-numeric: tabular-nums; }
#invoice-print tfoot td { font-weight: 700; background: #f4f4f4; }
#invoice-print .ip-tax td { background: #fafafa; }
#invoice-print .ip-words { margin-top: 10px; font-size: 12px; }
#invoice-print .ip-words b { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
#invoice-print .ip-signs { display: flex; gap: 30px; margin-top: 34px; }
#invoice-print .ip-sign { flex: 1; border-top: 1px solid #111; padding-top: 4px; font-size: 11px; }
#invoice-print .ip-terms { margin-top: 14px; padding-top: 8px;
  border-top: 1px dashed #999; font-size: 10px; color: #333; }
#invoice-print .ip-note { font-size: 10px; color: #a00; margin-top: 6px; }
@media print {
  #invoice-print .ip-sheet, #invoice-print table, #invoice-print .ip-signs { page-break-inside: avoid; }
  #challan-print .cp-sheet, #challan-print table, #challan-print .cp-signs,
  #challan-print .cp-words { page-break-inside: avoid; }
  #challan-print .cp-parties, #invoice-print .ip-parties { page-break-inside: avoid; }
  /* Browsers drop backgrounds on paper by default, which erased the shaded
     headers and totals. Force them so the printed document matches screen. */
  #challan-print th, #challan-print tfoot td,
  #invoice-print th, #invoice-print tfoot td, #invoice-print .ip-tax td {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}

@media print {
  /* Everything that is app furniture goes; the document itself is what prints. */
  .sidebar, .top-header, #toast-container, .btn, .card, .toggle-archived { display: none !important; }
  .main-wrapper { margin-left: 0 !important; }
  .main-content { max-width: none !important; padding: 0 !important; }
  /* Exactly one document prints. Both panels live in the same page, so
     showing both unconditionally would print the challan and the invoice
     together - two different legal documents on one sheet of paper. The body
     class is set by printChallan() / printInvoice() just before printing. */
  #challan-print, #invoice-print { display: none !important; }
  body.printing-challan #challan-print { display: block !important; }
  body.printing-invoice #invoice-print { display: block !important; }
  #challan-print .cp-sheet { font-size: 11.5px; }
  #invoice-print .ip-sheet { font-size: 11.5px; }
  /* A4 portrait with room for the letterhead. */
  @page { size: A4 portrait; margin: 12mm; }
  /* Repeat the column headings if the items overflow onto page two, and never
     split a single line across a page break. */
  #challan-print thead, #invoice-print thead { display: table-header-group; }
  #challan-print tr, #invoice-print tr { page-break-inside: avoid; break-inside: avoid; }
  #challan-print .cp-signs, #challan-print .cp-words { page-break-inside: avoid; }
  #invoice-print .ip-signs, #invoice-print .ip-words, #invoice-print .ip-tax { page-break-inside: avoid; }
}
</style>

    <div style="display:flex; gap:10px; align-items:center;">

      style="padding:8px 12px; border:1px solid var(--color-border); border-radius:6px; font-size:14px;">

<script>
(function(){
  let customers = [];
  let allChallans = [];
  let allProducts = [];
  // Edit mode: the draft being edited (null when creating), plus the line ids
  // it had when the form opened so removed lines can be deleted on save.
  let editingDraftId = null;
  let editingOriginalIds = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Display-only weight: at most 3 decimals ("0.00700" -> "0.007"), so a
  // sub-10g size like "7g" is never rounded into the wrong weight. The
  // data-weight attributes keep full precision for the maths.
  function fmtW2(n) {
    const v = parseFloat(n);
    if (isNaN(v)) return "—";
    return String(Math.round(v * 1000) / 1000);
  }

  /* Format a number to a fixed number of decimals.

     The API returns these as decimal STRINGS ("15.000", "2475.00"), so
     dropping them straight into a cell with esc() showed a packet count as
     "15.000". Packets are whole units and the challan form uses step="1", so
     quantity gets 0 decimals - which is also what both print views already
     did, so the screen and the printed document now agree. */
  function fmtNum(v, dp) {
    const n = parseFloat(v);
    if (isNaN(n)) return "0";
    return n.toFixed(dp == null ? 2 : dp);
  }

  async function loadCustomers() {
    try {
      const data = await window.UI.api("/customers");
      customers = data || [];
      const sel = document.getElementById("ch-customer");
      if (sel) {
        sel.innerHTML = '<option value="">Select customer…</option>' + window.UI.sortByName(customers).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
        if (window.UI.quickSelect) window.UI.quickSelect(sel, "Type customer name…");
      }
    } catch (e) { console.error("Load customers", e); }
  }

  async function loadProducts() {
    try {
      allProducts = await window.UI.api("/products") || [];
      // Rows built before /products resolved (fast + New click) would keep
      // only "+ Add new product…": refill any open rows, keeping picks.
      try { if (typeof refreshAllChallanProdDropdowns === "function") refreshAllChallanProdDropdowns(); } catch (e) {}
    } catch (e) { console.error("Load products", e); }
  }

  // Print-footer picker: company default first, then every active footer.
  // The choice freezes into the challan at creation; editing footers later
  // never rewrites it.
  async function loadFooters() {
    const sel = document.getElementById("ch-footer");
    if (!sel) return;
    let def = null;
    let list = [];
    try {
      const d = await window.UI.api("/print-footers") || {};
      def = d.default_id;
      list = (d.footers || []).filter(f => f.is_active !== false);
    } catch (e) { console.error("Load footers", e); }
    sel.innerHTML = '<option value="">Company default</option>' +
      window.UI.sortByName(list).map(f => `<option value="${f.id}"${def && f.id === def ? " selected" : ""}>${esc(f.name)}${def && f.id === def ? " (default)" : ""}</option>`).join("");
  }

  // Challan Entry profiles see the list and the create form only: payment
  // figures never reach them (the server strips paid/outstanding from the
  // payload too), and no View/Payment/Delete/Archive action is offered.
  function isChallanEntry() {
    try {
      const me = window.Auth ? window.Auth.getUser() : null;
      return String((me && me.role) || "") === "challan_entry";
    } catch (e) { return false; }
  }

  function renderChallanTable(list) {
    const archBadge = '<span class="badge badge-archived">Archived</span> ';
    // Status badge mapping
    function statusBadge(status) {
      const s = String(status || "").toLowerCase();
      if (s === "draft") return '<span class="badge badge-draft">Draft</span>';
      if (s === "confirmed") return '<span class="badge badge-confirmed">Confirmed</span>';
      if (s === "dispatched") return '<span class="badge badge-dispatched">Dispatched</span>';
      if (s === "delivered") return '<span class="badge badge-delivered">Delivered</span>';
      if (s === "cancelled") return '<span class="badge badge-cancelled">Cancelled</span>';
      if (s === "partially_paid") return '<span class="badge badge-partially_paid">Partially Paid</span>';
      if (s === "paid") return '<span class="badge badge-paid">Paid</span>';
      if (s === "closed") return '<span class="badge badge-closed">Closed</span>';
      return '<span class="badge badge-draft">' + s + '</span>';
    }
    const limited = isChallanEntry();
    const rows = (list || []).map(c => ({
      _archived: !!c.is_archived,
      number: (c.is_archived ? archBadge : "") + c.challan_number,
      date: window.UI.dateWithTime(c.challan_date, c.created_at),
      dateKey: window.UI.tsKey(c.challan_date, c.created_at),
      customer: c.customer_name || c.customer_id,
      status: statusBadge(c.status),
      delivery: c.delivered_at ? "Delivered" : (c.dispatched_at ? "Dispatched" : "—"),
      amount: window.UI.money(c.total_price),
      paid: limited ? "—" : window.UI.money(c.paid_amount),
      outstanding: limited ? "—" : window.UI.money(c.outstanding_amount),
      actions: limited ? "—" :
        // One shared flex row (see .row-actions in style.css): the buttons
        // stay aligned on a single line and the table scrolls sideways.
        (`<span class="row-actions">` +
          `<button class="btn btn-sm btn-info" onclick="viewChallan(${c.id})">View</button>` +
          (!c.is_archived ? ((() => {
            // A blocked Payment button explains itself via data-block-reason
            // (read by the global explainer) instead of opening a form that
            // can only fail. Drafts are not receivables yet; paid challans
            // have nothing left to collect.
            const st = String(c.status || "").toLowerCase();
            const out = parseFloat(c.outstanding_amount) || 0;
            const reason = st === "draft"
              ? "This challan is still a draft. Confirm it first — a draft is not yet a receivable, so no payment can be recorded against it."
              : (out <= 0
                ? "This challan is fully paid. There is nothing left to collect."
                : "");
            return `<button class="btn btn-sm btn-success" data-approve title="Record money received against this challan"${reason ? ` data-block-reason="${reason}"` : ""} onclick="openPaymentForm(${c.id})">₹ Payment Received</button>`;
          })()) : "") +
          (!c.is_archived && String(c.status || "").toLowerCase() === "draft"
            ? `<button class="btn btn-sm btn-warn" data-approve title="Edit customer, date, notes and line items" onclick="editChallan(${c.id})">Edit</button>` +
              `<button class="btn btn-sm btn-danger" data-approve title="Permanently delete this unpaid draft. Cannot be undone." onclick="deleteChallanForever(${c.id}, '${String(c.challan_number || "").replace(/'/g, "\\'")}', '${c.total_price}')">Delete</button>`
            : "") +
          (c.is_archived
            ? `<button class="btn btn-sm btn-restore" onclick="restoreChallan(${c.id})">Restore</button>`
            : `<button class="btn btn-sm btn-danger" onclick="deleteChallan(${c.id})">Archive</button>`) +
          `</span>`)
    }));
    const container = document.getElementById("challan-table");
    if (container && window.UI && window.UI.renderTable) {
      if (!rows.length) {
        container.innerHTML = "<p style='font-size:13px;color:#5b6b84;'>No challans found.</p>";
      } else {
        const cols = [
          { key: "number", label: "Number" },
          { key: "date", label: "Date" },
          { key: "customer", label: "Customer" },
          { key: "status", label: "Status" },
          { key: "delivery", label: "Delivery" },
          { key: "amount", label: "Amount (₹)" },
        ];
        if (!limited) {
          cols.push(
            { key: "paid", label: "Paid (₹)" },
            { key: "outstanding", label: "Balance Due (₹)" },
            { key: "actions", label: "Actions" },
          );
        }
        window.UI.renderTable(container, rows, cols, { rowClass: (r) => (r._archived ? "row-archived" : ""), pageSize: 15, sortValue: { number: (r) => window.UI.docNumKey(r.number), date: (r) => r.dateKey } });
      }
    } else if (container) {
      container.innerHTML = "<p style='font-size:13px;color:#5b6b84;'>No challans found.</p>";
    }
    const count = document.getElementById("challan-count");
    if (count) count.textContent = "Showing " + rows.length + " of " + allChallans.length + " challans" +
      (limited ? " · this login only" : "");
  }

  // "Current FY only" is driven purely by the user clicking it. Hand-editing
  // the From/To dates deliberately does NOT switch it off any more: choosing a
  // custom range is as manual as ticking the box, and the checkbox resetting
  // itself was the complaint. The dates are what actually filter.
  const CH_FILTER_KEY = "challans-filters";

  function saveChallanFilters() {
    window.UI.saveFilterState(CH_FILTER_KEY, {
      fyOnly: document.getElementById("challan-fy-only").checked,
      from: document.getElementById("challan-from").value,
      to: document.getElementById("challan-to").value,
      status: document.getElementById("challan-status").value,
      unpaidOnly: document.getElementById("challan-unpaid-only") &&
        document.getElementById("challan-unpaid-only").checked,
    });
  }

  function restoreChallanFilters() {
    const s = window.UI.loadFilterState(CH_FILTER_KEY);
    if (!s) return;
    const box = document.getElementById("challan-fy-only");
    if (box && typeof s.fyOnly === "boolean") box.checked = s.fyOnly;
    if (typeof s.from === "string") document.getElementById("challan-from").value = s.from;
    if (typeof s.to === "string") document.getElementById("challan-to").value = s.to;
    if (typeof s.status === "string") document.getElementById("challan-status").value = s.status;
    const unpaid = document.getElementById("challan-unpaid-only");
    if (unpaid && typeof s.unpaidOnly === "boolean") unpaid.checked = s.unpaidOnly;
    if (box && box.checked) window.UI.dropInvertedRange("challan-from", "challan-to");
  }

  window.challanStatusChanged = function () {
    saveChallanFilters();
    window.filterChallans();
  };

  // The unpaid-only checkbox lives in global-scope inline handlers; a direct
  // onchange="saveChallanFilters()" would throw ReferenceError (that function
  // is private to this IIFE) and the filter would silently never run.
  window.challanUnpaidChanged = function () {
    saveChallanFilters();
    window.filterChallans();
  };

  window.toggleChallanFy = function () {
    const box = document.getElementById("challan-fy-only");
    if (box.checked) window.UI.applyFyStart("challan-from", "challan-to");
    else document.getElementById("challan-from").value = "";
    saveChallanFilters();
    window.filterChallans();
  };

  window.challanDateChanged = function () {
    saveChallanFilters();
    window.filterChallans();
  };

  function sortChallans(list) {
    const mode = (document.getElementById("challan-sort") || {}).value || "date-desc";
    const num = c => window.UI.docNumKey(c.challan_number);
    const dated = c => c.challan_date ? new Date(c.challan_date).getTime() : 0;
    const sorted = (list || []).slice();
    // Same-day challans share one midnight timestamp, so the date alone ties:
    // the newest row (highest id) wins the tie, matching the API order.
    if (mode === "number-asc") sorted.sort((a, b) => num(a) - num(b) || String(a.challan_number || "").localeCompare(String(b.challan_number || "")));
    else if (mode === "number-desc") sorted.sort((a, b) => num(b) - num(a) || String(b.challan_number || "").localeCompare(String(a.challan_number || "")));
    else if (mode === "date-asc") sorted.sort((a, b) => dated(a) - dated(b) || (a.id || 0) - (b.id || 0));
    else sorted.sort((a, b) => dated(b) - dated(a) || (b.id || 0) - (a.id || 0));
    return sorted;
  }

  // On-hand packets per product + packet size, read once when the challan
  // form opens from the same balance endpoint the confirm stock guard
  // reads. Display-only: the confirm step still owns oversell refusals,
  // so a slightly stale figure here can never oversell by itself.
  let stockPackets = {};

  async function loadStockPackets() {
    try {
      const data = await window.UI.api("/finished-stock/balance") || {};
      const next = {};
      (data.rows || []).forEach(r => {
        next[String(r.product_id) + ":" + String(r.size_id)] = r.balance_packets;
      });
      stockPackets = next;
      document.querySelectorAll(".ch-item-row").forEach(refreshBalanceHint);
    } catch (e) { console.error("Load stock packets", e); }
  }

  function refreshBalanceHint(row) {
    const el = row && row.querySelector(".ch-balance");
    if (!el) return;
    const prodId = row.querySelector(".ch-prod").value;
    const packId = row.querySelector(".ch-pack").value;
    if (!prodId || !packId) { el.textContent = ""; return; }
    const key = String(prodId) + ":" + String(packId);
    if (!(key in stockPackets)) { el.textContent = "Balance: —"; return; }
    const pkts = Math.round((parseFloat(stockPackets[key]) || 0) * 100) / 100;
    el.textContent = "Balance: " + pkts + " pkts";
    el.style.color = pkts <= 0 ? "var(--color-danger)" : "var(--color-text-muted)";
  }

  // Deep-link from the dashboard overdue spotlight (?overdue=1): show only
  // open dues older than 30 days, with a clear action to drop the filter.
  let overdueOnly = window.location.hash.includes("overdue=1");

  function isOverdue(c) {
    if (!((parseFloat(c.outstanding_amount) || 0) > 0)) return false;
    if (!c.challan_date) return false;
    const ageDays = (Date.now() - new Date(c.challan_date).getTime()) / 86400000;
    return ageDays > 30;
  }

  window.clearOverdueFilter = function () {
    overdueOnly = false;
    try {
      history.replaceState(null, "", window.location.pathname + "#/challans");
    } catch (e) { /* hash stays; the flag is what filters */ }
    window.filterChallans();
  };

  // Shared exit from the detail card (header button and the one at the foot
  // of the actions). A Receive Payment form left open follows the card out:
  // the list view has nothing to fill it against.
  window.backToList = function () {
    document.getElementById("challan-detail-card").style.display = "none";
    const pay = document.getElementById("challan-pay-card");
    if (pay) pay.style.display = "none";
  };

  // One clean sweep of the Challan List filter card: every text, dropdown,
  // date and checkbox goes back to its entry state and the full list
  // returns. The saved filter state is overwritten with the blank set so a
  // reload doesn't resurrect it, and the overdue spotlight from
  // #/challans?overdue=1 is cleared the same way its own "Show all" link
  // does, so the flag cannot resettle.
  window.resetChallanFilters = function () {
    const val = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
    val("challan-search", "");
    val("challan-sort", "date-desc");
    val("challan-status", "");
    val("challan-from", "");
    val("challan-to", "");
    const fy = document.getElementById("challan-fy-only");
    if (fy) fy.checked = false;
    const unpaid = document.getElementById("challan-unpaid-only");
    if (unpaid) unpaid.checked = false;
    saveChallanFilters();
    overdueOnly = false;
    try {
      history.replaceState(null, "", window.location.pathname + "#/challans");
    } catch (e) {}
    window.filterChallans();
  };

  window.filterChallans = function () {
    // Re-arm from the URL on every run: navigating here with ?overdue=1
    // (dashboard spotlight) filters even without a page reload. Clearing
    // replaces the hash first, so an uncleared flag can never stick.
    if (window.location.hash.includes("overdue=1")) overdueOnly = true;
    const q = (document.getElementById("challan-search").value || "").trim().toLowerCase();
    const from = document.getElementById("challan-from").value;
    const to = document.getElementById("challan-to").value;
    let list = allChallans.filter(c => window.UI.inDateRange(c.challan_date, from, to));
    const statusF = document.getElementById("challan-status").value;
    if (statusF) list = list.filter(c => String(c.status || "").toLowerCase() === statusF);
    const unpaidBox = document.getElementById("challan-unpaid-only");
    if (unpaidBox && unpaidBox.checked) {
      list = list.filter(c => (parseFloat(c.outstanding_amount) || 0) > 0);
    }
    if (overdueOnly) list = list.filter(isOverdue);
    if (q) {
      list = list.filter(c => [c.challan_number, c.customer_name, c.status, c.customer_id, c.total_price,
          c.challan_date ? window.UI.fmtDay(c.challan_date) : ""]
        .map(v => String(v == null ? "" : v).toLowerCase()).some(v => v.includes(q)));
    }
    renderChallanTable(sortChallans(list));
    const count = document.getElementById("challan-count");
    // Total still owed across the filtered list. Challan Entry profiles get
    // paid/outstanding stripped server-side, so the sum is meaningless for
    // them and stays hidden.
    const dueTotal = isChallanEntry() ? null :
      list.reduce((s, c) => s + (parseFloat(c.outstanding_amount) || 0), 0);
    const dueTxt = dueTotal == null ? "" :
      " · Balance due: ₹ " + Number(dueTotal.toFixed(2)).toLocaleString("en-IN");
    if (count && overdueOnly) {
      count.innerHTML = esc(`Showing ${list.length} overdue challan(s) — dues older than 30 days.${dueTxt} `) +
        `<a href="javascript:void(0)" onclick="clearOverdueFilter()" style="font-size:12px;">Show all →</a>`;
    } else if (count) {
      count.textContent = "Showing " + list.length + " of " + allChallans.length + " challans" +
        (isChallanEntry() ? " · this login only" : "") + dueTxt;
    }
  };

  async function loadChallans() {
    try {
      const showArchived = document.getElementById("ch-show-archived").checked;
      const data = await window.UI.api("/challans" + (showArchived ? "?include_archived=true" : ""));
      allChallans = data || [];
      const q = document.getElementById("challan-search");
      window.filterChallans();
      return allChallans;
    } catch (e) {
      console.error("Load challans", e);
      document.getElementById("challan-msg").textContent = "Failed to load challans.";
    }
  }

  window.openNewChallanForm = async function () {
    editingDraftId = null;
    editingOriginalIds = [];
    // Always refresh: a customer or product added on another page during this
    // session would otherwise never appear in a new challan. The product
    // refresh keeps row picks; the customer select is reset just below.
    try { await loadCustomers(); } catch (e) {}
    try { await loadProducts(); } catch (e) {}
    document.getElementById("challan-form-title").textContent = "Create Challan";
    document.getElementById("challan-submit-btn").textContent = "Create Challan";
    document.getElementById("new-challan-form").reset();
    document.getElementById("ch-date").valueAsDate = new Date();
    document.getElementById("ch-items").innerHTML = "";
    document.getElementById("ch-footer").disabled = false;
    loadFooters();
    loadStockPackets();
    addChallanRow();
    updateChallanTotal();
    document.getElementById("challan-msg").textContent = "";
    document.getElementById("challan-form-wrap").style.display = "block";
    document.getElementById("ch-customer").focus();
  };

  window.cancelChallanForm = function () {
    editingDraftId = null;
    editingOriginalIds = [];
    document.getElementById("challan-form-title").textContent = "Create Challan";
    document.getElementById("challan-submit-btn").textContent = "Create Challan";
    document.getElementById("new-challan-form").reset();
    document.getElementById("ch-footer").disabled = false;
    document.getElementById("challan-form-wrap").style.display = "none";
  };

  // Keep old name working
  window.toggleForm = function () {
    const wrap = document.getElementById("challan-form-wrap");
    if (wrap.style.display === "none") { window.openNewChallanForm(); }
    else { window.cancelChallanForm(); }
  };

  // Rebuild every item row's product dropdown from the latest list (every
  // existing product is always listed), keeping each row's selection.
  function refreshAllChallanProdDropdowns() {
    const opts = '<option value="">Select…</option>' +
      window.UI.sortByName(allProducts).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
    document.querySelectorAll(".ch-prod").forEach(s => {
      const cur = s.value ? s.value : "";
      s.innerHTML = opts;
      if (cur) s.value = cur;
    });
  }

  function fillChallanPackOptions(div, prodSel, packSel) {
    const prod = allProducts.find(p => String(p.id) === String(prodSel.value));
    // Removed pack sizes stay out of the picker (server refuses them too),
    // and the ladder reads smallest-to-largest: challans mostly pick a
    // light pouch off a growing list.
    const sizes = ((prod && prod.packaging_sizes) || []).filter(s => s.is_active !== false)
      .slice().sort((a, b) =>
        (parseFloat(a.weight_in_kg) || 0) - (parseFloat(b.weight_in_kg) || 0) ||
        String(a.size_name || "").localeCompare(String(b.size_name || ""), undefined, { sensitivity: "base" }));
    // Keep the row's choice: rebuilding the options (e.g. when a draft is
    // restored or the products list is refetched) must not silently reset a
    // selected 250g back to the first size in the list. And never pre-select:
    // the placeholder forces an explicit pick, so Loose can never slip in as
    // an unnoticed default.
    const cur = packSel.value || "";
    packSel.innerHTML = '<option value="">Select size…</option>' + (sizes.length
      ? sizes.map(s => `<option value="${s.id}" data-weight="${s.weight_in_kg}" data-rate="${s.rate_per_kg}">${esc(s.size_name)} (${esc(fmtW2(s.weight_in_kg))} kg)</option>`).join("")
      : '<option value="">No sizes</option>');
    if (cur && [...packSel.options].some(o => o.value === cur)) packSel.value = cur;
    applyPackDefaults(div);
  }

  window.addChallanRow = function (inheritProduct) {
    const wrap = document.getElementById("ch-items");
    const div = document.createElement("div");
    div.className = "form-row ch-item-row";
    div.style.cssText = "align-items:flex-end; margin-bottom:8px; flex-wrap:wrap;";
    const prodOpts = window.UI.sortByName(allProducts).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
    div.innerHTML =
      `<div class="form-group" style="flex:1.8; min-width:220px;"><label>Product</label><select class="ch-prod" required><option value="">Select…</option>${prodOpts}</select></div>` +
      `<div class="form-group"><label>Packet Size</label><select class="ch-pack" required><option value="">Select product first</option></select></div>` +
      `<div class="form-group"><label>Qty (packets)</label><input class="ch-qty" type="number" step="1" value="1" min="1" /><div class="ch-balance" style="font-size:11px; color:var(--color-text-muted); margin-top:2px; min-height:15px;"></div></div>` +
      `<div class="form-group"><label>Weight (kg, auto)</label><input class="ch-weight" type="number" step="0.001" value="0" min="0" readonly tabindex="-1" style="background:#f5f8fc; color:var(--color-text-muted);" title="Auto-computed from quantity × packet weight" /></div>` +
      `<div class="form-group"><label>Sale Rate /kg</label><div style="display:flex; align-items:stretch;"><span style="display:flex; align-items:center; padding:0 8px; border:1px solid var(--color-border); border-right:0; border-radius:6px 0 0 6px; background:var(--color-surface-alt); font-size:14px; color:var(--color-text-muted);">₹</span><input class="ch-rate" type="text" inputmode="decimal" autocomplete="off" placeholder="_" style="flex:1; min-width:70px; border-radius:0 6px 6px 0;" oninput="updateChallanTotal()" /></div></div>` +
      `<div class="form-group"><label>Amount</label><div class="ch-amt" style="font-weight:700; font-size:16px; white-space:nowrap; padding:8px 0;">₹ 0.00</div></div>` +
      `<div class="form-group" style="max-width:70px;"><label>&nbsp;</label><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('.ch-item-row').remove(); updateChallanTotal();">✕</button></div>`;
    // A second line usually continues the same product, so "+ Add Item"
    // carries the previous row's product over (sizes start blank: billing
    // the same size twice must stay a conscious choice).
    const prevRows = wrap.querySelectorAll(".ch-item-row");
    const prevRow = inheritProduct ? prevRows[prevRows.length - 1] : null;
    wrap.appendChild(div);
    const prodSel = div.querySelector(".ch-prod");
    const packSel = div.querySelector(".ch-pack");
    if (window.UI.quickSelect) window.UI.quickSelect(prodSel, "Type product…");
    prodSel.addEventListener("change", () => {
      fillChallanPackOptions(div, prodSel, packSel);
    });
    // Carry the previous row's product into this one (sizes stay blank, so
    // billing the same size twice stays a conscious choice).
    if (inheritProduct && prevRow) {
      const inherited = prevRow.querySelector(".ch-prod").value;
      if (inherited) {
        prodSel.value = inherited;
        prodSel.dispatchEvent(new Event("change", { bubbles: true }));
      }
    }
    packSel.addEventListener("change", () => {
      applyPackDefaults(div);
    });
    if (prodSel.value) applyPackDefaults(div);
    return div;
  };

  // The rate cell shows what the eye expects — a rupee amount with two
  // decimals, en-IN grouped ("1,240.00") — while calculations keep parsing a
  // plain number out of it. The ₹ itself is a fixed prefix outside the box,
  // never part of the typed value.
  function parseRateStr(v) {
    const n = parseFloat(String(v == null ? "" : v).replace(/[^\d.]/g, ""));
    return isNaN(n) || n < 0 ? 0 : n;
  }

  function fmtRateInput(v) {
    const n = parseFloat(v);
    if (!(n > 0)) return "";
    return n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function applyPackDefaults(row) {
    refreshBalanceHint(row);
    const packSel = row.querySelector(".ch-pack");
    const opt = packSel.selectedOptions[0];
    if (!opt || !opt.dataset.weight) return;
    const w = parseFloat(opt.dataset.weight) || 0;
    const rate = parseFloat(opt.dataset.rate) || 0;
    const qty = parseFloat(row.querySelector(".ch-qty").value) || 0;
    row.querySelector(".ch-weight").value = (qty * w).toFixed(3);
    // A size without a stored rate leaves the box empty for the typed
    // price; a "0.00" dummy forced manual deletion on every entry.
    row.querySelector(".ch-rate").value = rate > 0 ? fmtRateInput(rate) : "";
    updateChallanTotal();
  }

  // Recompute weight when qty changes (keep rate as-is), then the total.
  // The total MUST refresh here and not in the input's own oninput: the
  // input-level handler runs first with the previous weight, so a total
  // computed there lags one keystroke behind forever (e.g. qty 2 showing
  // the total for qty 3). One computation, always on fresh values.
  document.addEventListener("input", (e) => {
    if (e.target && e.target.classList && e.target.classList.contains("ch-qty")) {
      const row = e.target.closest(".ch-item-row");
      if (row) {
        const packSel = row.querySelector(".ch-pack");
        const opt = packSel.selectedOptions[0];
        if (opt && opt.dataset.weight) {
          const qty = parseFloat(e.target.value) || 0;
          row.querySelector(".ch-weight").value = (qty * (parseFloat(opt.dataset.weight) || 0)).toFixed(3);
        }
        updateChallanTotal();
      }
    }
  });

  // Leaving the rate box re-presents the typed price as a clean rupee
  // amount ("42.5" -> "42.50", "1240" -> "1,240.00"); blank stays blank.
  document.addEventListener("focusout", (e) => {
    if (e.target && e.target.classList && e.target.classList.contains("ch-rate")) {
      e.target.value = fmtRateInput(parseRateStr(e.target.value));
    }
  });

  window.updateChallanTotal = function () {
    let total = 0;
    document.querySelectorAll(".ch-item-row").forEach(r => {
      const w = parseFloat(r.querySelector(".ch-weight").value) || 0;
      const rate = parseRateStr(r.querySelector(".ch-rate").value);
      const amt = w * rate;
      total += amt;
      const amtEl = r.querySelector(".ch-amt");
      if (amtEl) amtEl.textContent = window.UI.money(amt);
    });
    document.getElementById("ch-total").textContent = "Total: ₹ " + total.toFixed(2);
  };

  // Edit a draft challan: refill the create form with its header + lines and
  // switch the submit to update mode. Confirmed/closed/archived/dispatched
  // drafts are refused (the server re-checks), so the button is only offered
  // where this can succeed.
  window.editChallan = async function (id) {
    const msg = document.getElementById("challan-msg");
    try {
      if (!allProducts.length) await loadProducts();
      if (!customers.length) await loadCustomers();
      const d = await window.UI.api("/challans/" + id);
      const st = String(d.status || "").toLowerCase();
      if (st !== "draft") {
        window.UI.notify("Only draft challans can be edited. This one is " + st + ".", "error");
        return;
      }
      if (d.is_archived) { window.UI.notify("This challan is archived. Restore it before editing.", "error"); return; }
      if (d.dispatched_at || d.delivered_at) { window.UI.notify("This challan has already been dispatched.", "error"); return; }
      editingDraftId = d.id;
      editingOriginalIds = (d.items || []).map(it => it.id);
      document.getElementById("challan-form-title").textContent = "Edit Draft " + (d.challan_number || ("#" + d.id));
      document.getElementById("challan-submit-btn").textContent = "Save Changes";
      document.getElementById("ch-customer").value = String(d.customer_id || "");
      const iso = d.challan_date ? new Date(d.challan_date) : new Date();
      document.getElementById("ch-date").value = iso.getFullYear() + "-" +
        String(iso.getMonth() + 1).padStart(2, "0") + "-" + String(iso.getDate()).padStart(2, "0");
      document.getElementById("ch-notes").value = d.notes || "";
      // The footer text froze at creation; it is not editable.
      document.getElementById("ch-footer").disabled = true;
      loadStockPackets();
      const wrap = document.getElementById("ch-items");
      wrap.innerHTML = "";
      (d.items || []).forEach(it => {
        const row = window.addChallanRow();
        row.dataset.itemId = String(it.id);
        const prodSel = row.querySelector(".ch-prod");
        const packSel = row.querySelector(".ch-pack");
        prodSel.value = String(it.product_id || "");
        fillChallanPackOptionsWithValues(prodSel, packSel, it.packaging_size_id, it.quantity, it.weight, it.rate_per_kg);
      });
      if (!(d.items || []).length) window.addChallanRow();
      window.updateChallanTotal();
      msg.textContent = "";
      document.getElementById("challan-form-wrap").style.display = "block";
      document.getElementById("challan-form-wrap").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (e) {
      msg.textContent = e.message || "Could not load challan for editing.";
    }
  };

  // Set a row's pack dropdown then restore the stored qty/weight/rate.
  // fillChallanPackOptions applies the pack defaults (overwriting the rate),
  // so the stored values must be written after it, not before.
  function fillChallanPackOptionsWithValues(prodSel, packSel, packId, qty, weight, rate) {
    fillChallanPackOptions(prodSel.closest(".ch-item-row"), prodSel, packSel);
    if (packId != null) packSel.value = String(packId);
    const row = prodSel.closest(".ch-item-row");
    // Server sends quantity as a decimal string ("1.000"); packets are whole
    // units (step="1", display uses fmtNum(v, 0)), so normalize to an integer
    // instead of showing trailing zeros in the edit form.
    if (qty != null) { const qn = Math.round(parseFloat(qty)); row.querySelector(".ch-qty").value = isNaN(qn) ? qty : String(qn); }
    if (weight != null) row.querySelector(".ch-weight").value = weight;
    // Same money face as fresh entry ("1,240.00"), parsed clean on save.
    if (rate != null) row.querySelector(".ch-rate").value = fmtRateInput(parseFloat(rate));
  }

  window.saveChallan = async function (event) {
    if (event) event.preventDefault();
    const __release = window.UI.submitGuard(event);
    if (!__release) return;
    const msg = document.getElementById("challan-msg");
    const customerId = document.getElementById("ch-customer").value;
    if (!customerId) { msg.textContent = "Select a customer."; __release(); return; }
    // Collect rows with their stored line id ("" for newly added rows).
    const rows = [];
    document.querySelectorAll(".ch-item-row").forEach(r => {
      const prodId = r.querySelector(".ch-prod").value;
      const packId = r.querySelector(".ch-pack").value;
      if (prodId && packId) rows.push({
        itemId: r.dataset.itemId || "",
        product_id: parseInt(prodId),
        packaging_size_id: parseInt(packId),
        quantity: parseFloat(r.querySelector(".ch-qty").value) || 0,
        weight: parseFloat(r.querySelector(".ch-weight").value) || 0,
        rate_per_kg: parseRateStr(r.querySelector(".ch-rate").value),
      });
    });
    if (!rows.length) { msg.textContent = "Add at least one line item with product and packet size."; __release(); return; }
    if (editingDraftId) {
      // Update mode: header first, then existing lines, then new lines, then
      // removed lines last (adding before deleting keeps the server's
      // "at least one line" rule satisfied throughout).
      try {
        await window.UI.api("/challans/" + editingDraftId, {
          method: "PUT",
          body: {
            customer_id: parseInt(customerId),
            challan_date: document.getElementById("ch-date").value,
            notes: document.getElementById("ch-notes").value,
          },
        });
        const kept = new Set();
        for (const r of rows) {
          if (r.itemId) {
            kept.add(String(r.itemId));
            await window.UI.api("/challans/" + editingDraftId + "/items/" + r.itemId, {
              method: "PUT",
              body: {
                product_id: r.product_id,
                packaging_size_id: r.packaging_size_id,
                quantity: r.quantity,
                weight: r.weight,
                rate_per_kg: r.rate_per_kg,
              },
            });
          }
        }
        for (const r of rows) {
          if (!r.itemId) {
            const created = await window.UI.api("/challans/" + editingDraftId + "/items", {
              method: "POST",
              body: {
                product_id: r.product_id,
                packaging_size_id: r.packaging_size_id,
                quantity: r.quantity,
                weight: r.weight,
                rate_per_kg: r.rate_per_kg,
              },
            });
            if (created && created.id) kept.add(String(created.id));
          }
        }
        for (const oldId of editingOriginalIds) {
          if (!kept.has(String(oldId))) {
            await window.UI.api("/challans/" + editingDraftId + "/items/" + oldId, { method: "DELETE" });
          }
        }
        const savedId = editingDraftId;
        msg.textContent = "Draft challan updated.";
        window.cancelChallanForm();
        loadChallans();
        viewChallan(savedId);
        __release();
      } catch (e) {
        msg.textContent = e.message || "Error";
        __release();
      }
      return;
    }
    const items = rows.map(({ product_id, packaging_size_id, quantity, weight, rate_per_kg }) =>
      ({ product_id, packaging_size_id, quantity, weight, rate_per_kg }));
    if (!items.length) { msg.textContent = "Add at least one line item with product and packet size."; __release(); return; }
    // Anti-forget nudge: a blank number auto-numbers, so confirm the blank
    // explicitly instead of decorating the box. Typed numbers flow straight
    // through; drafts never reach here (edit path returns above).
    const typedNo = (document.getElementById("ch-number").value || "").trim();
    if (!typedNo && !confirm("Leave the challan number blank for auto-numbering?\n\nOK = use the next automatic number.\nCancel = go back and type one.")) { __release(); return; }
    try {
      const footerVal = document.getElementById("ch-footer").value;
      const res = await fetch("/challans", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          customer_id: parseInt(customerId),
          challan_date: document.getElementById("ch-date").value,
          challan_number: typedNo || null,
          notes: document.getElementById("ch-notes").value,
          footer_id: footerVal ? parseInt(footerVal) : null,
          items: items,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(window.UI.formatError(data, "Failed to create challan"));
      msg.textContent = `Created challan ${data.challan_number || ""} — ${fmtW2(data.total_weight)} kg, ₹ ${data.total_price || 0}`;
      document.getElementById("challan-form-wrap").style.display = "none";
      document.getElementById("new-challan-form").reset();
      loadChallans();
      __release();
    } catch (e) {
      msg.textContent = e.message || "Error";
      __release();
    }
  };

  // Backwards-compatible alias
  window.createChallan = function () { window.saveChallan(); };

  // Dispatch history for the transporter/vehicle pickers: fetched when a
  // challan opens, so the first entry is typed by hand and later ones pick
  // from it. A fetch failure just leaves both boxes as free-text inputs.
  async function loadDispatchOptions() {
    const fill = (id, values) => {
      const dl = document.getElementById(id);
      if (!dl) return;
      dl.innerHTML = (values || []).map(v =>
        `<option value="${esc(v).replace(/"/g, "&quot;")}">`).join("");
    };
    try {
      const d = await window.UI.api("/challans/dispatch-options") || {};
      fill("disp-transporter-list", d.transporters);
      fill("disp-vehicle-list", d.vehicles);
    } catch (e) { console.error("Dispatch options", e); }
  }

  window.viewChallan = async function (id, highlightPayId) {
    const card = document.getElementById("challan-detail-card");
    const body = document.getElementById("challan-detail-body");
    try {
      const d = await window.UI.api("/challans/" + id);
      const fmtD = iso => iso ? window.UI.fmtDay(iso) : "—";
      let dispatchHtml = "";
      if (d.is_archived) {
        dispatchHtml = "<div style='background:#f1f5f9; border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:13px;'>" +
          "🔒 This challan is archived and read-only. Restore it to dispatch, deliver or collect payment." +
          "</div>";
      } else if (d.delivered_at) {
        dispatchHtml = "<div style='background:#d1fae5; border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:13px;'>" +
          `✅ Delivered on ${fmtD(d.delivered_at)}` +
          (d.dispatched_at ? ` (dispatched ${fmtD(d.dispatched_at)})` : "") +
          (d.transporter ? ` · ${esc(d.transporter)}` : "") +
          (d.vehicle_no ? ` · ${esc(d.vehicle_no)}` : "") + "</div>";
      } else if (d.dispatched_at) {
        dispatchHtml = "<div style='background:#fef3c7; border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:13px;'>" +
          `🚚 Dispatched on ${fmtD(d.dispatched_at)}` +
          (d.transporter ? ` · ${esc(d.transporter)}` : "") +
          (d.vehicle_no ? ` · ${esc(d.vehicle_no)}` : "") +
          ` <button class="btn btn-sm btn-primary" data-approve style="margin-left:8px;" onclick="deliverChallan(${d.id})">Mark Delivered</button></div>`;
      } else {
        const today = new Date();
        const todayISO = today.getFullYear() + "-" +

        dispatchHtml = "<div style='background:#f5f8fc; border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:13px;'>" +
          `<strong>Dispatch</strong><div class="form-row" style="margin-top:8px;">` +
          `<div class="form-group"><label>Date</label><input id="disp-date" type="date" value="${todayISO}" /></div>` +
          `<div class="form-group"><label>Transporter</label><input id="disp-transporter" list="disp-transporter-list" placeholder="Type new, or pick from history" autocomplete="off" /><datalist id="disp-transporter-list"></datalist></div>` +
          `<div class="form-group"><label>Vehicle No</label><input id="disp-vehicle" list="disp-vehicle-list" placeholder="MH-12-AB-1234" autocomplete="off" /><datalist id="disp-vehicle-list"></datalist></div>` +
          `</div><button class="btn btn-sm btn-primary" data-approve id="disp-go" disabled title="Fill the dispatch date and transporter to enable" onclick="dispatchChallan(${d.id})">Dispatch Now</button>` +
          `<span style="font-size:12px; color:var(--color-text-muted); margin-left:8px;">Date and transporter are required; vehicle is optional.</span></div>`;
      }
      let itemsHtml = "<p>No items.</p>";
      if (d.items && d.items.length) {
        itemsHtml = "<table><thead><tr><th>Product</th><th>Pack Size</th><th>Qty</th><th>Weight</th><th>Rate</th><th>Amount</th></tr></thead><tbody>" +
          d.items.map(it => `<tr><td>${esc(it.product_name || "—")}</td><td>${esc(it.size_name || "—")}</td><td class="num">${fmtNum(it.quantity, 0)} pkts</td><td class="num">${fmtNum(it.weight, 3)} kg</td><td class="num">${fmtNum(it.rate_per_kg, 2)}/kg</td><td class="num">${fmtNum(it.amount, 2)}</td></tr>`).join("") +
          "</tbody></table>";
      }
      let payHtml = "";
      try {
        const showArch = document.getElementById("ch-show-archived").checked;
        const pays = await window.UI.api("/payments/challan/" + id + (showArch ? "?include_archived=true" : ""));
        if (pays && pays.length) {
          payHtml = "<h4 style='font-size:14px; margin:12px 0 6px;'>Payments Received</h4><div class='table-wrap'><table><thead><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Ref</th><th></th></tr></thead><tbody>" +
            pays.map(p => `<tr data-pay-id="${p.id}"${p.is_archived ? " class='row-archived'" : ""}><td>${p.is_archived ? "<span class='badge badge-archived'>Archived</span> " : ""}${window.UI.dateWithTime(p.payment_date, p.created_at)}</td><td>${window.UI.money(p.amount)}</td><td>${esc(p.payment_mode || "—")}</td><td title="${esc(p.transaction_ref || "")}">${esc(p.transaction_ref || "—")}</td><td><span class="row-actions">${p.is_archived ? `<button class="btn btn-sm btn-restore" onclick="restoreChallanPayment(${p.id}, ${id})">Restore</button>` : `<button class="btn btn-sm btn-warn" data-approve title="Correct amount, date, mode or ref" onclick="editChallanPayment(${p.id}, ${id})">Edit</button><button class="btn btn-sm btn-danger" onclick="deleteChallanPayment(${p.id}, ${id})">Archive</button>`}</span></td></tr>`).join("") +

      body.innerHTML = dispatchHtml +

        // the actions row below; Back to List sits highlighted in the header.
        "<div style='display:grid; grid-template-columns: 92px 1fr 92px 1fr; gap:3px 10px; margin-bottom:10px; font-size:13px;'>" +
        "<strong>Number</strong><span>" + esc(d.challan_number) + "</span>" +
        "<strong>Date</strong><span>" + window.UI.dateWithTime(d.challan_date, d.created_at) + "</span>" +

        "<strong>Status</strong><span>" + esc(d.status) + "</span>" +
        "<strong>Total</strong><span>" + window.UI.money(d.total_price) + "</span>" +
        "<strong>Paid</strong><span>" + window.UI.money(d.paid_amount) + "</span>" +

      if (highlightPayId) {
        const row = body.querySelector('tr[data-pay-id="' + highlightPayId + '"]');
        if (row) {
          row.style.background = "#fef9c3";
          row.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
      // Dispatch Now stays dormant until the two details it cannot do
      // without (dispatch date + transporter) carry a value; the vehicle
      // stays optional. Typing re-evaluates immediately. The button keeps
      // its inline onclick: a natively disabled button never fires click
      // events, so the guard here is the only gate it needs.
      const dispGo = document.getElementById("disp-go");
      if (dispGo) {
        const dateEl = document.getElementById("disp-date");
        const trEl = document.getElementById("disp-transporter");
        const syncDispatch = () => {
          dispGo.disabled = !((dateEl.value || "") && ((trEl.value || "").trim()));

      }
      // Build the printable copy first so the Print button is never visible

      buildPrintPanel(d);
      renderChallanActions(d);
      loadDispatchOptions();
    } catch (e) {
      body.innerHTML = "<p style='color:var(--color-danger)'>Could not load details: " + esc(e.message || e) + "</p>";
      card.style.display = "block";
      document.getElementById("challan-detail-actions").innerHTML = "";
    }
  };

  function renderChallanActions(d) {
    const box = document.getElementById("challan-detail-actions");
    const st = String(d.status || "").toLowerCase();
    let html = "";
    if (d.is_archived) {
      html = "<span class=\"badge badge-archived\">Archived · read-only</span>";
      box.innerHTML = html;
      return;
    }
    if (st === "draft") {
      // Dispatched drafts already left the building: the server refuses any
      // edit with a reason, so don't offer the button at all.
      if (!d.dispatched_at && !d.delivered_at) {
        html += `<button class="btn btn-sm btn-warn" data-approve onclick="editChallan(${d.id})" title="Edit customer, date, notes and line items">Edit Draft</button> `;
      }
      html += `<button class="btn btn-sm btn-primary" data-approve onclick="setChallanStatus(${d.id}, 'confirmed')" title="Confirm this challan">Confirm Challan</button>`;
    }
    if (["draft", "confirmed", "partially_paid", "paid"].includes(st)) {
      html += `<button class="btn btn-sm btn-restore" data-approve onclick="setChallanStatus(${d.id}, 'closed')" title="Mark this challan as closed (no further changes)">Close Challan</button>`;
    }
    if (st === "closed") html += `<span class="badge badge-closed">Closed</span> <button class="btn btn-sm btn-restore" data-approve onclick="reopenChallan(${d.id})" title="Reopen this challan (undo the close)">Reopen</button>`;
    html += ` <button class="btn btn-sm btn-export" onclick="printChallan(${d.id})" title="Print an A4 delivery challan">Print Challan</button>`;
    // A sales invoice is a separate tax document raised FROM this challan.
    // Which of the two buttons to show depends on whether one already exists,
    // so ask the server rather than guessing from the status. A challan that
    // is not yet billable (draft, or goods not dispatched) keeps its button
    // so the blocked click can explain itself instead of hiding the action.
    const invBlocked = st === "draft"
      ? "This challan is still a draft \u2014 confirm it first. A draft is not yet a receivable, so it cannot be billed."
      : (!d.dispatched_at
        ? "This challan has not been dispatched yet. A tax invoice is raised when the goods leave, not before."
        : "");
    html += ` <button class="btn btn-sm btn-opening" data-approve id="inv-btn-${d.id}"${invBlocked ? ` data-block-reason="${invBlocked}"` : ""}
        onclick="openInvoice(${d.id})" title="Raise or print the sales invoice for this challan">Sales Invoice…</button>`;
    html += ` <button class="btn btn-sm btn-wa" id="wa-btn-${d.id}"
        onclick="shareInvoice(${d.id})" title="Share the sales invoice on WhatsApp" aria-label="Share on WhatsApp"
        style="padding:6px 10px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#25D366" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></button>`;
    html += ` <button class="btn btn-sm btn-info" id="pdf-btn-${d.id}"
        onclick="downloadInvoicePdf(${d.id})" title="Download the sales invoice as a PDF file">PDF</button>`;

  /* Build the printable document from the challan's FROZEN header, never from
     the live company profile: editing the profile later must not change what an
     already-issued challan says. Every value printed here comes from the
     snapshot columns on the challan itself. */
  function escP(v) { return esc(v == null ? "" : String(v)); }

  function printLine(label, value) {
    if (!value) return "";
    return `<div class="cp-line">${escP(label)}: ${escP(value)}</div>`;
  }

  function buildPrintPanel(d) {
    const fmtD = iso => iso ? window.UI.fmtDay(iso) : "—";
    const num = (v, dp) => {
      const n = parseFloat(v);
      return isNaN(n) ? "0" : n.toFixed(dp == null ? 2 : dp);
    };
    const totalPkts = (d.items || []).reduce((a, it) => a + (parseFloat(it.quantity) || 0), 0);
    const totalKg = (d.items || []).reduce((a, it) => a + (parseFloat(it.weight) || 0), 0);
    const totalAmt = (d.items || []).reduce((a, it) => a + (parseFloat(it.amount) || 0), 0);

    // Printing the GSTIN on a delivery challan is a business choice, not a
    // legal requirement - the challan carries no tax. Suppressing it avoids
    // the copy being read as tax paperwork. Falls back to showing it if the
    // settings call fails, because hiding it is the optional direction.
    const showGstin = window.UI ? window.UI.challanShowGstin !== false : true;

    const coLines = [
      d.company_address,
      d.company_phone ? "Phone: " + d.company_phone : "",
      d.company_email,
    ].filter(Boolean).map(l => `<div class="cp-line">${escP(l)}</div>`).join("");

    // The challan is a DELIVERY document, not a tax invoice - the business
    // confirmed this. A tax invoice is issued separately from the challan
    // (which must exist first). Saying so on the printed face is the
    // cheapest way to stop it being filed or claimed as an invoice, so the
    // wording is part of the document rather than a note in the help file.
    const notAnInvoice = `<div class="cp-notinv">This is a delivery challan tracking movement
      of goods, not a tax invoice.</div>`;

    const head = d.stamped ? `
        <div class="cp-co">
          <h1>${escP(d.company_name || "")}</h1>
          ${coLines}
          ${(d.company_gstin && showGstin) ? `<div class="cp-line cp-gst">GSTIN: ${escP(d.company_gstin)}</div>` : ""}
        </div>` : `
        <div class="cp-co">
          <h1>Delivery Challan</h1>
          <div class="cp-line cp-warn">Company details not recorded for this challan.
            Set them in Settings &rsaquo; Company Profile.</div>
        </div>`;

    const custLines = [
      d.cust_company_name,
      d.cust_address,
      d.cust_gst_no ? "GSTIN: " + d.cust_gst_no : "",
      d.cust_contact_number ? "Phone: " + d.cust_contact_number : "",
    ].filter(Boolean).map(l => `<div class="cp-line">${escP(l)}</div>`).join("");

    const rows = (d.items || []).map((it, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${escP(it.product_name || "—")}</td>
          <td>${escP(it.size_name || "—")}</td>
          <td class="num">${num(it.quantity, 0)} pkts</td>
          <td class="num">${num(it.weight, 3)} kg</td>
          <td class="num">${num(it.rate_per_kg, 2)}/kg</td>
          <td class="num">${num(it.amount, 2)}</td>
        </tr>`).join("");

    const el = document.getElementById("challan-print");
    if (!el) return;
    el.innerHTML = `
      <div class="cp-sheet">
        <div class="cp-head">
          <img src="/frontend/assets/logo.png?v=4" alt="" />
          ${head}
        </div>

        <div class="cp-title">
          <div class="cp-kind">Delivery Challan</div>
          <div class="cp-no"><b>${escP(d.challan_number)}</b> &nbsp;&middot;&nbsp; Date: ${fmtD(d.challan_date)}
            &nbsp;&middot;&nbsp; Status: ${escP(d.status)}</div>
          ${notAnInvoice}
        </div>

        <div class="cp-parties">
          <div class="cp-party">
            <h4>Delivered To</h4>
            <div class="cp-line"><b>${escP(d.customer_name || "—")}</b></div>
            ${custLines}
          </div>
          <div class="cp-party">
            <h4>Summary</h4>
            ${printLine("Total packets", num(totalPkts, 0))}
            ${printLine("Total weight (kg)", num(totalKg, 3) + " kg")}
            ${printLine("Paid", "₹ " + num(d.paid_amount, 2))}
            ${printLine("Outstanding", "₹ " + num(d.outstanding_amount, 2))}

  /* Both print paths set a body class so the print stylesheet knows which of
     the two documents to emit, then clear it afterwards. Without that, printing
     an invoice would also print the challan sitting in the other panel. */
  function printOnly(cls) {
    document.body.classList.add(cls);
    window.print();
    // afterprint is not universally reliable, so also clear it on a short
    // timer; a stale class would blank the next print.
    setTimeout(() => document.body.classList.remove(cls), 500);
  }

  window.openInvoice = async function (challanId) {

      .getAttribute("data-invoice-id");

    try {

      const btn = document.getElementById("inv-btn-" + challanId);
      if (btn) {
        btn.textContent = "Print Sales Invoice";

  // Share the sales invoice on WhatsApp (click-to-chat): opens WhatsApp
  // with the invoice summary prefilled; sending and attaching the PDF stay
  // manual. No Meta setup, no cost. Needs the customer's phone number.
  window.shareInvoice = async function (challanId) {
    const existingId = (document.getElementById("inv-btn-" + challanId) || {})
      .getAttribute("data-invoice-id");
    if (!existingId) {
      window.UI.infoDialog("Nothing to share yet",
        "Raise the sales invoice first (Sales Invoice… button), then share it.");
      return;
    }
    try {
      const d = await window.UI.api("/invoices/" + existingId);
      let digits = String(d.cust_contact_number || "").replace(/\D/g, "");
      if (digits.length === 10) digits = "91" + digits;
      if (digits.length !== 12) {
        window.UI.infoDialog("No WhatsApp number",
          "This customer has no usable 10-digit phone number. Add it on the Customers page first.");
        return;
      }
      const date = d.invoice_date ? window.UI.fmtDay(d.invoice_date) : "";
      // Draft challans carry outstanding 0 (not yet receivables), so a zero
      // balance with zero paid must NOT read as "(paid)" - it means no money
      // has moved at all.
      const bal = parseFloat(d.challan_outstanding) || 0;
      const got = parseFloat(d.challan_paid) || 0;
      const tail = bal > 0 ? ` | Balance due: ₹${d.challan_outstanding}`
        : (got > 0 ? " (paid)" : " (no payment recorded yet)");
      const lines = [
        `${d.company_name || "Tax Invoice"} — Tax Invoice ${d.invoice_number || ""} dated ${date}`,
        d.challan_number ? `Delivery challan: ${d.challan_number}` : "",
        `Total: ₹${d.grand_total || 0}${tail}`,
      ].filter(Boolean).join("\n");
      window.open("https://wa.me/" + digits + "?text=" + encodeURIComponent(lines), "_blank");
    } catch (e) {
      window.UI.notify(e.message || "Could not load the invoice", "error");
    }
  };

  window.printInvoice = async function (invoiceId) {
    const d = await window.UI.api("/invoices/" + invoiceId);
    const el = document.getElementById("invoice-print");
    if (!el) return;

    const escP = v => esc(v == null ? "" : String(v));
    const num = (v, dp) => {
      const n = parseFloat(v);
      return isNaN(n) ? "0" : n.toFixed(dp == null ? 2 : dp);
    };
    const fmtD = iso => iso ? window.UI.fmtDay(iso) : "";

    const coLines = [
      d.company_address,
      d.company_phone ? "Phone: " + d.company_phone : "",
      d.company_email,
    ].filter(Boolean).map(l => `<div class="ip-line">${escP(l)}</div>`).join("");

    const custName = d.cust_company_name || d.customer_name || "";
    const custLines = [
      d.cust_address,
      d.cust_gst_no ? "GSTIN: " + d.cust_gst_no : "",
      d.place_of_supply ? "Place of supply: " + d.place_of_supply : "",
      d.cust_contact_number ? "Phone: " + d.cust_contact_number : "",
    ].filter(Boolean).map(l => `<div class="ip-line">${escP(l)}</div>`).join("");
    const custNameHtml = custName
      ? `<div class="ip-cust-name">${escP(custName)}</div>` : "";

    const rows = (d.items || []).map((it, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${escP(it.product_name || "—")}</td>
        <td>${escP(it.size_name || "—")}</td>
        <td>${escP(it.hsn_code || "—")}</td>
        <td class="num">${num(it.quantity, 0)} pkts</td>
        <td class="num">${num(it.weight, 3)} kg</td>
        <td class="num">${num(it.rate_per_kg, 2)}/kg</td>
        <td class="num">${num(it.amount, 2)}</td>
        <td class="num">${num(it.taxable_value, 2)}</td>
        <td class="num">${num(it.gst_rate, 2)}%</td>
        <td class="num">${num(
          (parseFloat(it.cgst) || 0) + (parseFloat(it.sgst) || 0) + (parseFloat(it.igst) || 0), 2)}</td>
        <td class="num">${num(it.amount, 2)}</td>
      </tr>`).join("");

    // The tax breakup, one row set per distinct GST rate so mixed-rate
    // invoices cannot show a single misleading figure. Which heads appear
    // depends on the supply type frozen on the invoice: an inter-state
    // supply shows IGST only. CGST/SGST are each half the line rate.
    const rfmt = v => String(Math.round((parseFloat(v) || 0) * 100) / 100);
    const rateGroups = {};
    (d.items || []).forEach(it => {
      const r = Math.round((parseFloat(it.gst_rate) || 0) * 100) / 100;
      const g = rateGroups[r] || (rateGroups[r] = { rate: r, cgst: 0, sgst: 0, igst: 0 });
      g.cgst += parseFloat(it.cgst) || 0;
      g.sgst += parseFloat(it.sgst) || 0;
      g.igst += parseFloat(it.igst) || 0;
    });
    const taxCell = v => `<td class="num">${num(v, 2)}</td>`;
    const taxRows = Object.values(rateGroups).map(g => {
      if (d.intra_state) {
        const half = rfmt(g.rate / 2);
        return `<tr class="ip-tax"><td colspan="9"></td><td class="num">CGST @ ${half}%</td>${taxCell(g.cgst)}${taxCell(g.cgst)}</tr>`
          + `<tr class="ip-tax"><td colspan="9"></td><td class="num">SGST @ ${half}%</td>${taxCell(g.sgst)}${taxCell(g.sgst)}</tr>`;
      }
      return `<tr class="ip-tax"><td colspan="9"></td><td class="num">IGST @ ${rfmt(g.rate)}%</td>${taxCell(g.igst)}${taxCell(g.igst)}</tr>`;
    }).join("");

    const noHsn = (d.items || []).filter(it => !it.hsn_code).length;

    el.innerHTML = `
      <div class="ip-sheet">
        <div class="ip-head">
          <img src="/frontend/assets/logo.png?v=4" alt="" />
          <div class="ip-co">
            <h1>${escP(d.company_name || "")}</h1>
            ${coLines}
            ${d.company_gstin ? `<div class="ip-line ip-gst">GSTIN: ${escP(d.company_gstin)}</div>` : ""}
          </div>
        </div>

        <div class="ip-title">
          <div class="ip-kind">Tax Invoice</div>
          <div class="ip-taxdoc">This is a tax invoice. GST is charged on the amounts shown below.</div>
          <div class="ip-no"><b>${escP(d.invoice_number)}</b> &nbsp;&middot;&nbsp;
            Date: ${fmtD(d.invoice_date)}
            ${d.challan_number ? `&nbsp;&middot;&nbsp; Delivery challan: ${escP(d.challan_number)}` : ""}</div>
        </div>

        <div class="ip-parties">
          <div class="ip-party">
            <h4>Billed to</h4>
            ${custNameHtml}
            ${custLines}
          </div>
          <div class="ip-party">
            <h4>Supply details</h4>
            <div class="ip-line">${d.intra_state ? "Intra-state supply (CGST + SGST)" : "Inter-state supply (IGST)"}</div>
            <div class="ip-line">Challan: ${escP(d.challan_number || "—")}</div>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>#</th><th>Product</th><th>Size</th><th>HSN</th>
              <th class="num">Qty</th><th class="num">Weight</th><th class="num">Rate</th>
              <th class="num">Amount</th>
              <th class="num">Taxable</th><th class="num">GST %</th><th class="num">Tax</th>
              <th class="num">Total</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
          <tfoot>
            <tr><td colspan="8">Taxable value</td>
                <td class="num" colspan="3">${num(d.taxable_value, 2)}</td>
                <td class="num">${num(d.grand_total, 2)}</td></tr>
            ${taxRows}
            <tr><td colspan="11" style="text-align:right">Grand total</td>
                <td class="num">${num(d.grand_total, 2)}</td></tr>
          </tfoot>
        </table>

        <div class="ip-words">
          <b>Total in words</b><br />${escP(d.total_in_words || "")}
        </div>

        ${noHsn ? `<div class="ip-note">${noHsn} line(s) have no HSN code. Set it in Inventory → Edit product → HSN code - your customer may need it to claim input credit.</div>` : ""}

        <div class="ip-signs">
          <div class="ip-sign">For ${escP(d.company_name || "the seller")}</div>
          <div class="ip-sign">Authorised signatory</div>
          <div class="ip-sign">Received by</div>
        </div>

        ${d.company_terms ? `<div class="ip-terms">${escP(d.company_terms)}</div>` : ""}
      </div>`;
    printOnly("printing-invoice");
  };

    const ok = confirm(
      "Permanently DELETE challan " + number + "?\n\n" +
      "Value: " + total + "\n\n" +
      "This cannot be undone and the challan will no longer appear in any " +
      "list or report. The deletion itself is recorded in the audit history.\n\n" +
      "If you only want to hide it, use Archive instead - that is reversible."

    try {

  window.renderReceivePaymentPicker = function () {
    const listEl = document.getElementById("recvpick-list");
    const countEl = document.getElementById("recvpick-count");
    if (!listEl) return;
    const q = ((document.getElementById("recvpick-search") || {}).value || "").trim().toLowerCase();
    const cand = (allChallans || []).filter(c =>
      !c.is_archived &&
      String(c.status || "").toLowerCase() !== "draft" &&
      (parseFloat(c.outstanding_amount) || 0) > 0 &&
      (!q || [c.challan_number, c.customer_name, c.status].some(f =>
        String(f == null ? "" : f).toLowerCase().includes(q))));
    if (countEl) {
      countEl.textContent = cand.length
        ? cand.length + " pending challan" + (cand.length === 1 ? "" : "s") + " — pick one:"
        : "";
    }
    if (!cand.length) {
      listEl.innerHTML =
        "<p style='font-size:13px; color:var(--color-text-muted); margin:6px 0 0;'>" +
        "No pending challans match. Confirmed challans that still owe money appear here.</p>";

      `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--color-border); border-radius:8px; margin-bottom:6px;">` +
